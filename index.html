let user=null, invoices=[], customers=[], activeView='home', editingId=null, draftTimer=null;

function userRef(){return doc(db,'users',user.uid)} function sub(name){return collection(db,'users',user.uid,name)}
function setSync(text,cls=''){const el=$('sync');if(el){el.textContent=text;el.className='sync '+cls}}
function draftKey(){return 'roofart-draft-'+(user?.uid||'guest')}
function blankInvoice(){return {invoiceNumber:'',customer:{id:'',name:'',phone:'',address:'',notes:''},date:new Date().toISOString().slice(0,10),woods:[blankWood()],extraMaterials:[blankMaterial()],manufacturing:[blankManufacturing()],discount:{type:'amount',value:0},payments:[],invoiceNotes:'',status:'draft'}}
function blankWood(){return {count:'',length:'',width:'',thickness:'',quantityM3:0,unitPrice:'',total:0,notes:''}}
function blankMaterial(){return {name:'',quantity:'',unitPrice:'',total:0}}
function blankManufacturing(){return {product:'',price:''}}
function calc(inv){inv.woods=(inv.woods||[]).map(r=>{const q=n(r.count)*n(r.length)*n(r.width)*n(r.thickness)/1000000;return {...r,quantityM3:q,total:q*n(r.unitPrice)}});inv.extraMaterials=(inv.extraMaterials||[]).map(r=>({...r,total:n(r.quantity)*n(r.unitPrice)}));inv.manufacturing=inv.manufacturing||[];const wood=inv.woods.reduce((a,r)=>a+n(r.total),0),mat=inv.extraMaterials.reduce((a,r)=>a+n(r.total),0),man=inv.manufacturing.reduce((a,r)=>a+n(r.price),0),before=wood+mat+man;let discount=n(inv.discount?.value);if(inv.discount?.type==='percent')discount=before*discount/100;const final=Math.max(0,before-discount),paid=(inv.payments||[]).reduce((a,p)=>a+n(p.amount),0),remaining=Math.max(0,final-paid);const status=inv.status==='draft'?'draft':remaining<=0&&final>0?'paid':paid>0?'partial':'unpaid';return {...inv,totals:{wood,materials:mat,manufacturing:man,beforeDiscount:before,discount,finalTotal:final,paid,remaining},status}}
async function reserveInvoiceNumber(){const ref=doc(db,'users',user.uid,'counters','invoiceNumber');return runTransaction(db,async tx=>{const snap=await tx.get(ref);let next=snap.exists()?n(snap.data().next):1;if(!snap.exists() && invoices.length){next=Math.max(1,...invoices.map(x=>n(x.invoiceNumber||x.number)))+1}tx.set(ref,{next:next+1,updatedAt:serverTimestamp()},{merge:true});return String(next).padStart(6,'0')})}
async function ensureProfile(){const r=userRef();const s=await getDoc(r);if(!s.exists())await setDoc(r,{uid:user.uid,email:user.email||'',name:user.displayName||'',createdAt:serverTimestamp()},{merge:true})}
async function loadAll(){if(!user)return;setSync('جارٍ المزامنة','');let invoiceError=null,customerError=null;try{const is=await getDocs(sub('invoices'));invoices=is.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt?.toDate?.()||b.updatedAt?.toDate?.()||b.date||'').localeCompare(String(a.createdAt?.toDate?.()||a.updatedAt?.toDate?.()||a.date||'')));invoices=invoices.map(x=>calc(normalizeInvoice(x)));}catch(e){invoiceError=e;console.error('Invoices load error:',e)}try{const cs=await getDocs(sub('customers'));customers=cs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));}catch(e){customerError=e;console.error('Customers load error:',e);customers=[]}if(invoiceError){setSync('تعذر تحميل الفواتير','off');toast('تعذر تحميل الفواتير: '+(invoiceError.code||invoiceError.message||'خطأ غير معروف'))}else if(customerError){setSync('الفواتير محملة — العملاء غير متاحين','ok');}else{setSync(navigator.onLine?'تمت المزامنة':'محلي — بدون اتصال',navigator.onLine?'ok':'off')}render()}
function normalizeInvoice(x){
  const legacy=Array.isArray(x.rows)||Object.prototype.hasOwnProperty.call(x,'client')||Object.prototype.hasOwnProperty.call(x,'number')||Object.prototype.hasOwnProperty.call(x,'paid');
  const o={...blankInvoice(),...x};
  o.invoiceNumber=x.invoiceNumber||x.number||'';
  o.date=x.date||new Date().toISOString().slice(0,10);

  if(legacy){
    const oldRows=Array.isArray(x.rows)?x.rows:[];
    o.customer={...blankInvoice().customer,name:String(x.client||''),phone:String(x.phone||''),address:String(x.address||''),notes:String(x.clientNotes||'')};
    o.woods=oldRows.length?oldRows.map(r=>({
      count:r.count??r.quantity??'',
      length:r.length??'',width:r.width??'',thickness:r.thickness??'',
      unitPrice:r.unitPrice??r.price??'',quantityM3:r.volume??0,total:r.total??0,notes:r.notes??r.note??''
    })): [blankWood()];
    const oldMats=Array.isArray(x.materials)?x.materials:[];
    o.extraMaterials=oldMats.map(r=>({name:r.name??'',quantity:r.quantity??r.count??1,unitPrice:r.unitPrice??r.price??'',total:r.total??0}));
    o.manufacturing=(x.manufacturing!==undefined&&x.manufacturing!==null&&x.manufacturing!=='')?[{product:'التصنيع',price:x.manufacturing}]:[];
    const paid=n(x.paid);
    o.payments=paid>0?[{amount:paid,date:o.date,note:'دفعة مسجلة في الفاتورة القديمة'}]:[];
    o.discount={type:'amount',value:0};
    o.invoiceNotes=String(x.invoiceNotes||x.notes||'');
    o.status=paid>0?'partial':'unpaid';
  }else{
    o.customer={...blankInvoice().customer,...(x.customer||{})};
    o.woods=Array.isArray(x.woods)&&x.woods.length?x.woods:[blankWood()];
    o.extraMaterials=Array.isArray(x.extraMaterials)?x.extraMaterials:[];
    o.manufacturing=Array.isArray(x.manufacturing)?x.manufacturing:(x.manufacturing?[{product:'التصنيع',price:x.manufacturing}]:[]);
    o.payments=Array.isArray(x.payments)?x.payments:[];
    o.discount=x.discount&&typeof x.discount==='object'?x.discount:{type:'amount',value:n(x.discount)};
  }

function nav(){return `<div class="bottom"><div class="bottom-inner">${[['home','🏠','الرئيسية'],['invoices','🧾','الفواتير'],['quick','⚡','الحساب السريع'],['customers','👥','العملاء'],['more','☰','المزيد']].map(x=>`<button class="nav ${activeView===x[0]?'active':''}" data-nav="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></div>`}
function shell(content){return `<div class="top"><div class="brand"><div class="brand-wrap"><img class="brand-logo" src="${data}" alt="Roof ART"><div><div class="tag">فن تصنيع الأخشاب · خبرة • إتقان • تميّز</div><div class="services-line">تصميم وتنفيذ أعمال الروف والديكورات الخشبية<br>تجاليد حوائط · برجولات · أسوار حدائق · أرضيات باركيه · سلالم خشبية</div></div></div><div id="sync" class="sync">...</div></div></div><main class="app">${content}</main>${nav()}`}
function home(){const active=invoices.filter(x=>!x.deleted),sales=active.filter(x=>x.date===new Date().toISOString().slice(0,10)).reduce((a,x)=>a+n(x.totals?.finalTotal),0),month=active.filter(x=>(x.date||'').slice(0,7)===new Date().toISOString().slice(0,7)).reduce((a,x)=>a+n(x.totals?.finalTotal),0),paid=active.reduce((a,x)=>a+n(x.totals?.paid),0),remain=active.reduce((a,x)=>a+n(x.totals?.remaining),0);return shell(`<section class="card home-brand"><div style="position:relative;z-index:1;text-align:center"><img class="brand-logo" src="${data}" alt="Roof ART"><div style="font-weight:900;font-size:16px;margin-top:3px">تصميم وتنفيذ أعمال الروف والديكورات الخشبية</div><div class="service-list" style="justify-content:center"><span class="service-pill">تجاليد حوائط</span><span class="service-pill">برجولات</span><span class="service-pill">أسوار حدائق</span><span class="service-pill">أرضيات باركيه</span><span class="service-pill">سلالم خشبية</span></div></div></section><section class="card"><div class="btns"><button class="btn primary" id="newBtn">➕ فاتورة جديدة</button><button class="btn gold" id="quickBtn">⚡ حساب سريع</button><button class="btn light" id="listBtn">🧾 الفواتير</button><button class="btn light" id="custBtn">👥 العملاء</button></div></section><section class="card"><div class="title">لوحة التحكم</div><div class="summary"><div class="stat"><small>مبيعات اليوم</small><b>${money(sales)}</b></div><div class="stat"><small>مبيعات الشهر</small><b>${money(month)}</b></div><div class="stat"><small>إجمالي المدفوع</small><b>${money(paid)}</b></div><div class="stat"><small>إجمالي المتبقي</small><b>${money(remain)}</b></div></div></section><section class="card"><div class="title">آخر الفواتير</div>${invoiceRows(active.slice(0,8))}</section>`)}
function invoiceRows(arr){if(!arr.length)return '<div class="empty">لا توجد فواتير بعد</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>رقم</th><th>العميل</th><th>التاريخ</th><th>الإجمالي</th><th>المتبقي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${arr.map(i=>`<tr><td>${esc(i.invoiceNumber||'-')}</td><td>${esc(i.customer?.name||'بدون اسم')}</td><td>${esc(i.date||'-')}</td><td>${money(i.totals?.finalTotal)}</td><td>${money(i.totals?.remaining)}</td><td>${badge(i.status)}</td><td><div class="row-actions"><button class="btn small light" data-open="${i.id}">فتح</button><button class="btn small light" data-copy="${i.id}">نسخ</button><button class="btn small danger" data-trash="${i.id}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`}
function badge(s){return `<span class="badge ${s||'draft'}">${s==='paid'?'مدفوعة بالكامل':s==='partial'?'مدفوعة جزئيًا':s==='unpaid'?'غير مدفوعة':'مسودة'}</span>`}
function invoiceEditor(inv,quick=false){inv=calc(JSON.parse(JSON.stringify(inv)));const isEdit=!!editingId;return shell(`<section class="card"><div class="title">${quick?'⚡ الحساب السريع':isEdit?'🧾 تعديل الفاتورة':'🧾 فاتورة جديدة'}</div><div class="grid"><div class="field"><label>رقم الفاتورة</label><input id="invoiceNumber" value="${esc(inv.invoiceNumber)}" readonly placeholder="يُنشأ عند الحفظ"></div><div class="field"><label>التاريخ</label><input id="invoiceDate" type="date" value="${esc(inv.date)}"></div><div class="field span2"><label>العميل</label><input id="customerName" list="customerList" value="${esc(inv.customer.name)}" placeholder="اسم العميل"><datalist id="customerList">${customers.map(c=>`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`).join('')}</datalist></div><div class="field"><label>رقم الهاتف</label><input id="customerPhone" value="${esc(inv.customer.phone)}"></div><div class="field"><label>العنوان</label><input id="customerAddress" value="${esc(inv.customer.address)}"></div><div class="field span2"><label>ملاحظات العميل</label><input id="customerNotes" value="${esc(inv.customer.notes)}"></div></div></section>${woodSection(inv)}${materialSection(inv)}${manufacturingSection(inv)}${summarySection(inv)}${paymentSection(inv)}<section class="card"><div class="title">📝 ملاحظات الفاتورة</div><div class="field"><textarea id="invoiceNotes" placeholder="مثال: التسليم خلال 15 يوم...">${esc(inv.invoiceNotes)}</textarea></div></section><section class="card"><div class="btns"><button class="btn primary" id="saveInvoice">💾 حفظ</button><button class="btn gold" id="shareInvoice">📤 مشاركة</button>${quick?'<button class="btn light" id="convertQuick">🧾 تحويل إلى فاتورة</button>':''}<button class="btn light" id="cancelEdit">رجوع</button></div></section>`)}
function woodSection(inv){return `<section class="card"><div class="title">① الأخشاب</div><div class="table-wrap"><table class="table" id="woodTable"><thead><tr><th>العدد</th><th>الطول سم</th><th>العرض سم</th><th>السمك سم</th><th>الكمية م³</th><th>سعر المتر</th><th>الإجمالي</th><th>ملاحظات</th><th>×</th></tr></thead><tbody>${inv.woods.map((r,i)=>woodRow(r,i)).join('')}</tbody></table></div><div class="btns" style="margin-top:8px"><button class="btn small light" id="addWood">➕ إضافة صف</button></div><div class="total-line"><span>إجمالي الأخشاب</span><b id="woodTotal">${money(inv.totals.wood)}</b></div></section>`}
function woodRow(r,i){return `<tr data-row="${i}"><td data-label="العدد"><input data-k="count" value="${esc(r.count)}"></td><td data-label="الطول سم"><input data-k="length" value="${esc(r.length)}"></td><td data-label="العرض سم"><input data-k="width" value="${esc(r.width)}"></td><td data-label="السمك سم"><input data-k="thickness" value="${esc(r.thickness)}"></td><td data-label="الكمية م³" class="qty">${n(r.quantityM3).toFixed(3)}</td><td data-label="سعر المتر"><input data-k="unitPrice" value="${esc(r.unitPrice)}"></td><td data-label="الإجمالي" class="lineTotal">${money(r.total)}</td><td data-label="ملاحظات"><input data-k="notes" value="${esc(r.notes)}"></td><td><button class="btn small danger" data-delwood="${i}">×</button></td></tr>`}
function materialSection(inv){return `<section class="card"><div class="title">② الخامات الإضافية</div><div class="table-wrap"><table class="table" id="matTable"><thead><tr><th>العدد</th><th>الصنف</th><th>سعر الوحدة</th><th>الإجمالي</th><th>×</th></tr></thead><tbody>${inv.extraMaterials.map((r,i)=>`<tr data-mrow="${i}"><td data-label="العدد"><input data-k="quantity" value="${esc(r.quantity)}"></td><td data-label="الصنف"><input data-k="name" value="${esc(r.name)}"></td><td data-label="سعر الوحدة"><input data-k="unitPrice" value="${esc(r.unitPrice)}"></td><td data-label="الإجمالي" class="matTotal">${money(r.total)}</td><td><button class="btn small danger" data-delmat="${i}">×</button></td></tr>`).join('')}</tbody></table></div><div class="btns" style="margin-top:8px"><button class="btn small light" id="addMat">➕ إضافة خامة</button></div><div class="total-line"><span>إجمالي الخامات الإضافية</span><b id="matTotal">${money(inv.totals.materials)}</b></div></section>`}
function manufacturingSection(inv){return `<section class="card"><div class="title">③ التصنيع</div><div class="table-wrap"><table class="table"><thead><tr><th>المنتج</th><th>سعر التصنيع</th><th>×</th></tr></thead><tbody>${inv.manufacturing.map((r,i)=>`<tr data-mrow2="${i}"><td data-label="المنتج"><input data-k="product" value="${esc(r.product)}"></td><td data-label="سعر التصنيع"><input data-k="price" value="${esc(r.price)}"></td><td><button class="btn small danger" data-delman="${i}">×</button></td></tr>`).join('')}</tbody></table></div><div class="btns" style="margin-top:8px"><button class="btn small light" id="addMan">➕ إضافة منتج</button></div><div class="total-line"><span>إجمالي التصنيع</span><b id="manTotal">${money(inv.totals.manufacturing)}</b></div></section>`}
function summarySection(inv){return `<section class="card"><div class="title">💰 ملخص الحساب</div><div class="summary"><div class="stat"><small>الأخشاب</small><b id="sWood">${money(inv.totals.wood)}</b></div><div class="stat"><small>الخامات</small><b id="sMat">${money(inv.totals.materials)}</b></div><div class="stat"><small>التصنيع</small><b id="sMan">${money(inv.totals.manufacturing)}</b></div><div class="stat"><small>قبل الخصم</small><b id="sBefore">${money(inv.totals.beforeDiscount)}</b></div></div><div class="grid" style="margin-top:8px"><div class="field"><label>الخصم</label><input id="discountValue" type="number" value="${n(inv.discount.value)}"></div><div class="field"><label>نوع الخصم</label><select id="discountType"><option value="amount" ${inv.discount.type==='amount'?'selected':''}>مبلغ</option><option value="percent" ${inv.discount.type==='percent'?'selected':''}>نسبة %</option></select></div></div><div class="summary" style="margin-top:8px"><div class="stat"><small>قيمة الخصم</small><b id="sDiscount">${money(inv.totals.discount)}</b></div><div class="stat"><small>الإجمالي النهائي</small><b id="sFinal">${money(inv.totals.finalTotal)}</b></div><div class="stat"><small>إجمالي المدفوع</small><b id="sPaid">${money(inv.totals.paid)}</b></div><div class="stat"><small>المتبقي</small><b id="sRemaining">${money(inv.totals.remaining)}</b></div></div></section>`}
function paymentSection(inv){return `<section class="card"><div class="title">💳 الدفعات</div><div id="payments">${(inv.payments||[]).map((p,i)=>`<div class="grid" data-pay="${i}" style="margin-bottom:7px"><div class="field"><label>المبلغ</label><input data-k="amount" type="number" value="${n(p.amount)}"></div><div class="field"><label>التاريخ</label><input data-k="date" type="date" value="${esc(p.date||inv.date)}"></div><div class="field span2"><label>ملاحظة</label><input data-k="note" value="${esc(p.note||'')}"></div><button class="btn small danger" data-delpay="${i}">حذف الدفعة</button></div>`).join('')}</div><button class="btn small light" id="addPayment">➕ إضافة دفعة</button></section>`}
function collectEditor(){const inv=calc({invoiceNumber:$('invoiceNumber')?.value||'',date:$('invoiceDate').value,customer:{name:$('customerName').value.trim(),phone:$('customerPhone').value.trim(),address:$('customerAddress').value.trim(),notes:$('customerNotes').value.trim()},woods:Array.from(document.querySelectorAll('#woodTable tbody tr')).map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.value);return o}),extraMaterials:Array.from(document.querySelectorAll('#matTable tbody tr')).map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.value);return o}),manufacturing:Array.from(document.querySelectorAll('[data-mrow2]')).map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.value);return o}),discount:{type:$('discountType').value,value:n($('discountValue').value)},payments:Array.from(document.querySelectorAll('[data-pay]')).map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.value);return o}),invoiceNotes:$('invoiceNotes').value,status:activeView==='quick'?'draft':'unpaid'});return inv}
function bindEditor(){const update=()=>{const inv=collectEditor();refreshTotals(inv);localStorage.setItem(draftKey(),JSON.stringify(inv));if(activeView==='quick')localStorage.setItem('roofart-quick',JSON.stringify(inv))};document.querySelectorAll('#woodTable input,#matTable input,[data-mrow2] input,[data-pay] input,#discountValue,#discountType,#invoiceDate,#customerName,#customerPhone,#customerAddress,#customerNotes,#invoiceNotes').forEach(el=>el.addEventListener('input',update));$('addWood')?.addEventListener('click',()=>{const inv=collectEditor();inv.woods.push(blankWood());renderEditor(inv)});$('addMat')?.addEventListener('click',()=>{const inv=collectEditor();inv.extraMaterials.push(blankMaterial());renderEditor(inv)});$('addMan')?.addEventListener('click',()=>{const inv=collectEditor();inv.manufacturing.push(blankManufacturing());renderEditor(inv)});$('addPayment')?.addEventListener('click',()=>{const inv=collectEditor();inv.payments.push({amount:'',date:inv.date,note:''});renderEditor(inv)});document.querySelectorAll('[data-delwood]').forEach(b=>b.onclick=()=>{const inv=collectEditor();inv.woods.splice(+b.dataset.delwood,1);if(!inv.woods.length)inv.woods.push(blankWood());renderEditor(inv)});document.querySelectorAll('[data-delmat]').forEach(b=>b.onclick=()=>{const inv=collectEditor();inv.extraMaterials.splice(+b.dataset.delmat,1);if(!inv.extraMaterials.length)inv.extraMaterials.push(blankMaterial());renderEditor(inv)});document.querySelectorAll('[data-delman]').forEach(b=>b.onclick=()=>{const inv=collectEditor();inv.manufacturing.splice(+b.dataset.delman,1);if(!inv.manufacturing.length)inv.manufacturing.push(blankManufacturing());renderEditor(inv)});document.querySelectorAll('[data-delpay]').forEach(b=>b.onclick=()=>{const inv=collectEditor();inv.payments.splice(+b.dataset.delpay,1);renderEditor(inv)});$('saveInvoice').onclick=()=>saveInvoice();$('cancelEdit').onclick=()=>{editingId=null;activeView='home';render()};$('shareInvoice').onclick=()=>shareInvoice();$('convertQuick')?.addEventListener('click',()=>{const inv=collectEditor();inv.customer={id:'',name:'',phone:'',address:'',notes:''};inv.payments=[];inv.invoiceNumber='';activeView='invoices';editingId=null;localStorage.setItem('roofart-quick',JSON.stringify(inv));renderEditor(inv,false);toast('تم تحويل الحساب إلى فاتورة — أكمل بيانات العميل ثم احفظ')});document.querySelectorAll('#woodTable input').forEach((el,i)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'&&el===document.querySelector('#woodTable tbody tr:last-child td:nth-last-child(2) input')){$('addWood')?.click();setTimeout(()=>document.querySelector('#woodTable tbody tr:last-child input')?.focus(),50)}}))}
function refreshTotals(inv){for(const [id,val] of [['sWood',inv.totals.wood],['sMat',inv.totals.materials],['sMan',inv.totals.manufacturing],['sBefore',inv.totals.beforeDiscount],['sDiscount',inv.totals.discount],['sFinal',inv.totals.finalTotal],['sPaid',inv.totals.paid],['sRemaining',inv.totals.remaining]])$(id).textContent=money(val);$('woodTotal').textContent=money(inv.totals.wood);$('matTotal').textContent=money(inv.totals.materials);$('manTotal').textContent=money(inv.totals.manufacturing);document.querySelectorAll('#woodTable tbody tr').forEach((tr,i)=>{const r=inv.woods[i];tr.querySelector('.qty').textContent=n(r.quantityM3).toFixed(3);tr.querySelector('.lineTotal').textContent=money(r.total)});document.querySelectorAll('#matTable tbody tr').forEach((tr,i)=>tr.querySelector('.matTotal').textContent=money(inv.extraMaterials[i].total))}
function renderEditor(inv){$('app').innerHTML=invoiceEditor(inv);bindEditor()}
async function saveInvoice(){try{let inv=collectEditor();if(!inv.customer.name){alert('اكتب اسم العميل أولًا');return}if(!editingId){inv.invoiceNumber=await reserveInvoiceNumber()}else{inv.invoiceNumber=$('invoiceNumber').value}inv=calc(inv);const data={...inv,updatedAt:serverTimestamp(),updatedBy:user.uid}; if(!editingId){data.createdAt=serverTimestamp();data.createdBy=user.uid;}if(editingId)await setDoc(doc(sub('invoices'),editingId),data,{merge:true});else await addDoc(sub('invoices'),data);await setDoc(doc(sub('customers'),normalizeId(inv.customer.phone||inv.customer.name)),{...inv.customer,updatedAt:serverTimestamp()},{merge:true});localStorage.removeItem(draftKey());toast('تم حفظ الفاتورة بنجاح');editingId=null;activeView='invoices';await loadAll()}catch(e){console.error(e);alert('تعذر الحفظ: '+e.message)}}
function normalizeId(s){return String(s).toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,'-').slice(0,80)||('c-'+Date.now())}
async function openInvoice(id){const s=await getDoc(doc(sub('invoices'),id));if(!s.exists())return;editingId=id;renderEditor(calc({id,...s.data()}))}
async function trashInvoice(id){if(!confirm('نقل الفاتورة إلى سلة المحذوفات؟'))return;const r=doc(sub('invoices'),id),s=await getDoc(r);if(!s.exists())return;await setDoc(doc(sub('trash'),id),{...s.data(),deletedAt:serverTimestamp(),deletedBy:user.uid});await deleteDoc(r);await loadAll();toast('تم نقل الفاتورة إلى السلة')}
function copyInvoice(id){const x=invoices.find(i=>i.id===id);if(!x)return;editingId=null;const c=JSON.parse(JSON.stringify(x));delete c.id;c.invoiceNumber='';c.date=new Date().toISOString().slice(0,10);c.payments=[];c.status='draft';renderEditor(c)}
function invoicesView(){return shell(`<section class="card"><div class="title">🧾 سجل الفواتير <span class="muted">(${invoices.filter(x=>!x.deleted).length})</span></div><div class="grid"><div class="field span2"><label>بحث</label><input id="search" placeholder="رقم الفاتورة أو اسم العميل أو الهاتف"></div><div class="field"><label>الحالة</label><select id="invoiceFilter"><option value="all">كل الفواتير</option><option value="paid">مدفوعة بالكامل</option><option value="partial">مدفوعة جزئيًا</option><option value="unpaid">غير مدفوعة</option><option value="draft">مسودة</option></select></div><div class="field"><label>الفترة</label><select id="invoicePeriod"><option value="all">كل الفترات</option><option value="today">اليوم</option><option value="month">هذا الشهر</option></select></div></div><div id="invoiceList" style="margin-top:10px">${invoiceRows(invoices.filter(x=>!x.deleted))}</div></section>`)}
function customersView(){return shell(`<section class="card"><div class="title">👥 العملاء</div><div class="field"><label>بحث</label><input id="custSearch" placeholder="الاسم أو الهاتف"></div><div id="custList" style="margin-top:10px">${customerRows(customers)}</div></section>`)}
function customerRows(arr){if(!arr.length)return '<div class="empty">لا يوجد عملاء</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الهاتف</th><th>العنوان</th><th>الفواتير</th><th>إجراء</th></tr></thead><tbody>${arr.map(c=>{const cs=invoices.filter(i=>!i.deleted&&(i.customer?.phone===c.phone||i.customer?.name===c.name));const total=cs.reduce((a,i)=>a+n(i.totals?.finalTotal),0),rem=cs.reduce((a,i)=>a+n(i.totals?.remaining),0);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'-')}</td><td>${esc(c.address||'-')}</td><td>${cs.length}<br>${money(total)}<br>متبقي ${money(rem)}</td><td><button class="btn small light" data-newcust="${esc(c.name)}">فاتورة</button></td></tr>`}).join('')}</tbody></table></div>`}
function quickView(){const d=JSON.parse(localStorage.getItem('roofart-quick')||'null')||blankInvoice();d.invoiceNumber='';d.customer={id:'',name:'',phone:'',address:'',notes:''};d.payments=[];d.status='draft';return invoiceEditor(d,true)}
function moreView(){return shell(`<section class="card"><div class="title">⚙️ المزيد</div><div class="btns"><button class="btn light" id="trashBtn">🗑️ سلة المحذوفات</button><button class="btn light" id="backupBtn">💾 نسخة احتياطية</button><button class="btn light" id="restoreBtn">♻️ استعادة نسخة</button><button class="btn light" id="settingsBtn">🎨 المظهر والإعدادات</button><button class="btn light" id="dataDiagBtn">🔎 فحص بيانات الفواتير</button><button class="btn light" id="woodLibBtn">🪵 مكتبة الأخشاب</button><button class="btn light" id="matLibBtn">🔩 مكتبة الخامات</button><button class="btn light" id="manLibBtn">🛠️ مكتبة التصنيع</button><button class="btn danger" id="logoutBtn">تسجيل الخروج</button></div></section>`)}
function loginView(){return `<main class="app login"><section class="card loginbox"><img class="login-logo-img" src="${data}" alt="Roof ART"><div class="title">تصميم وتنفيذ أعمال الروف والديكورات الخشبية</div><p class="muted">تجاليد حوائط · برجولات · أسوار حدائق · أرضيات باركيه · سلالم خشبية</p><p class="muted">خبرة • إتقان • تميّز</p><button class="btn primary" id="loginBtn">الدخول بحساب Google</button></section></main>`}
function render(){if(!user){$('app').innerHTML=loginView();$('modalRoot').innerHTML='';$('loginBtn').onclick=()=>signInWithPopup(auth,provider);return}let html=activeView==='home'?home():activeView==='invoices'?invoicesView():activeView==='customers'?customersView():activeView==='quick'?quickView():moreView();$('app').innerHTML=html;bindGlobal()}
function bindGlobal(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{activeView=b.dataset.nav;editingId=null;render()});$('newBtn')?.addEventListener('click',async()=>{editingId=null;const inv=blankInvoice();renderEditor(inv)});$('quickBtn')?.addEventListener('click',()=>{activeView='quick';render()});$('listBtn')?.addEventListener('click',()=>{activeView='invoices';render()});$('custBtn')?.addEventListener('click',()=>{activeView='customers';render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openInvoice(b.dataset.open));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyInvoice(b.dataset.copy));document.querySelectorAll('[data-trash]').forEach(b=>b.onclick=()=>trashInvoice(b.dataset.trash));const applyInvoiceFilters=()=>{const q=($('search')?.value||'').toLowerCase();const f=$('invoiceFilter')?.value||'all';const p=$('invoicePeriod')?.value||'all';const now=new Date(),today=now.toISOString().slice(0,10),month=today.slice(0,7);const arr=invoices.filter(i=>!i.deleted&&(String(i.invoiceNumber||'').includes(q)||(i.customer?.name||'').toLowerCase().includes(q)||(i.customer?.phone||'').includes(q))&&(f==='all'||i.status===f)&&(p==='all'||(p==='today'&&i.date===today)||(p==='month'&&(i.date||'').slice(0,7)===month)));$('invoiceList').innerHTML=invoiceRows(arr)};$('search')?.addEventListener('input',applyInvoiceFilters);$('invoiceFilter')?.addEventListener('change',applyInvoiceFilters);$('invoicePeriod')?.addEventListener('change',applyInvoiceFilters);$('custSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('custList').innerHTML=customerRows(customers.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)))});$('logoutBtn')?.addEventListener('click',()=>signOut(auth));$('backupBtn')?.addEventListener('click',backup);$('restoreBtn')?.addEventListener('click',restore);$('trashBtn')?.addEventListener('click',trashView);$('settingsBtn')?.addEventListener('click',settingsView);$('dataDiagBtn')?.addEventListener('click',dataDiagnostics);$('woodLibBtn')?.addEventListener('click',()=>libraryView('wood'));$('matLibBtn')?.addEventListener('click',()=>libraryView('mat'));$('manLibBtn')?.addEventListener('click',()=>libraryView('man'));document.querySelectorAll('[data-newcust]').forEach(b=>b.onclick=()=>{const c=customers.find(x=>x.name===b.dataset.newcust);const inv=blankInvoice();inv.customer=c||inv.customer;renderEditor(inv)})}
function trashView(){const root=$('modalRoot');root.innerHTML='<div class="modal"><div class="modalbox"><div class="title">🗑️ سلة المحذوفات</div><div id="trashContent">جاري التحميل...</div><div class="btns"><button class="btn light" onclick="document.getElementById(\'modalRoot\').innerHTML=\'\'">إغلاق</button></div></div></div>';loadTrash()}
async function loadTrash(){const s=await getDocs(sub('trash'));const arr=s.docs.map(d=>({id:d.id,...d.data()}));$('trashContent').innerHTML=arr.length?arr.map(x=>`<div class="card"><b>${esc(x.invoiceNumber||'-')} — ${esc(x.customer?.name||'')}</b><div class="muted">${money(x.totals?.finalTotal)}</div><button class="btn small light" data-restore="${x.id}">استعادة</button><button class="btn small danger" data-perm="${x.id}">حذف نهائي</button></div>`).join(''):'<div class="empty">السلة فارغة</div>';document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreTrash(b.dataset.restore));document.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>deleteTrash(b.dataset.perm));$('emptyTrash')?.addEventListener('click',emptyTrash)}
async function restoreTrash(id){const s=await getDoc(doc(sub('trash'),id));if(!s.exists())return;const d=s.data();delete d.deletedAt;delete d.deletedBy;await setDoc(doc(sub('invoices'),id),d);await deleteDoc(doc(sub('trash'),id));await loadAll();trashView()}
async function deleteTrash(id){if(!confirm('حذف نهائي؟ لا يمكن التراجع.'))return;await deleteDoc(doc(sub('trash'),id));trashView()}
async function emptyTrash(){if(!confirm('تأكيد إفراغ سلة المحذوفات نهائيًا؟'))return;const s=await getDocs(sub('trash'));const batch=writeBatch();s.docs.forEach(d=>batch.delete(d.ref));await batch.commit();trashView();toast('تم إفراغ السلة')}
async function backup(){const payload={version:1,exportedAt:new Date().toISOString(),customers,invoices};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});downloadBlob(blob,'Roof-ART-backup.json')}
function restore(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const batch=writeBatch(db);for(const x of data.customers||[])batch.set(doc(sub('customers'),x.id||normalizeId(x.name)),x,{merge:true});for(const x of data.invoices||[]){const id=x.id||crypto.randomUUID();delete x.id;batch.set(doc(sub('invoices'),id),x,{merge:true})}await batch.commit();await loadAll();toast('تمت الاستعادة')}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};input.click()}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function libraryView(type){const labels={wood:'مكتبة الأخشاب',mat:'مكتبة الخامات',man:'مكتبة التصنيع'};const field=type==='wood'?'name':'name';const coll=type==='wood'?'woodMaterials':type==='mat'?'extraMaterials':'manufacturingItems';const s=await getDocs(sub(coll));const arr=s.docs.map(d=>({id:d.id,...d.data()}));$('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="title">${labels[type]}</div><div id="libList">${arr.map(x=>`<div class="grid" style="margin:6px 0"><input class="field" data-lib-name="${esc(x.id)}" value="${esc(x.name||x.product||'')}"><input class="field" data-lib-price="${esc(x.id)}" type="number" value="${n(x.price??x.defaultPrice)}"><button class="btn small primary" data-lib-save="${esc(x.id)}">حفظ</button><button class="btn small danger" data-lib-del="${esc(x.id)}">×</button></div>`).join('')||'<div class="empty">المكتبة فارغة</div>'}</div><div class="divider"></div><div class="grid"><input id="newLibName" placeholder="اسم الصنف"><input id="newLibPrice" type="number" placeholder="السعر الافتراضي"><button class="btn primary" id="addLib">إضافة</button></div><div class="btns" style="margin-top:12px"><button class="btn light" onclick="document.getElementById('modalRoot').innerHTML=''">إغلاق</button></div></div></div>`;document.querySelectorAll('[data-lib-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.libSave;const name=document.querySelector(`[data-lib-name="${CSS.escape(id)}"]`).value.trim();const price=n(document.querySelector(`[data-lib-price="${CSS.escape(id)}"]`).value);await setDoc(doc(sub(coll),id),{name,price,updatedAt:serverTimestamp()},{merge:true});toast('تم الحفظ')});document.querySelectorAll('[data-lib-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الصنف من المكتبة؟')){await deleteDoc(doc(sub(coll),b.dataset.libDel));libraryView(type)}});$('addLib').onclick=async()=>{const name=$('newLibName').value.trim();if(!name)return;await addDoc(sub(coll),{name,price:n($('newLibPrice').value),createdAt:serverTimestamp(),updatedAt:serverTimestamp()});libraryView(type)}}

async function dataDiagnostics(){const root=$('modalRoot');root.innerHTML='<div class="modal"><div class="modalbox"><div class="title">🔎 فحص بيانات Roof ART</div><div id="diag">جاري الفحص...</div><div class="btns" style="margin-top:12px"><button class="btn light" onclick="document.getElementById(\'modalRoot\').innerHTML=\'\'">إغلاق</button></div></div></div>';try{const snap=await getDocs(sub('invoices'));const raw=snap.docs.map(d=>({id:d.id,...d.data()}));const legacy=raw.filter(x=>Array.isArray(x.rows)||Object.prototype.hasOwnProperty.call(x,'number')||Object.prototype.hasOwnProperty.call(x,'client')||Object.prototype.hasOwnProperty.call(x,'paid'));const nums=raw.map(x=>x.invoiceNumber||x.number).filter(Boolean).slice(0,10);$('diag').innerHTML=`<div class="stat"><small>حساب Google</small><b style="font-size:13px;word-break:break-all">${esc(user?.email||'-')}</b></div><div class="stat" style="margin-top:8px"><small>UID</small><b style="font-size:11px;word-break:break-all">${esc(user?.uid||'-')}</b></div><div class="summary" style="margin-top:8px"><div class="stat"><small>عدد الفواتير التي يراها Firebase</small><b>${raw.length}</b></div><div class="stat"><small>فواتير بالصيغة القديمة</small><b>${legacy.length}</b></div></div><p class="muted" style="margin-top:10px">المسار: users/${esc(user?.uid||'')}/invoices</p><p class="muted">أول أرقام موجودة: ${esc(nums.join(' ، ')||'لا يوجد')}</p>${raw.length?'':'<p style="color:#a42d2d;font-weight:800">Firebase لا يعرض أي مستندات لهذا الحساب. إذا كان البرنامج القديم يعرض فواتير، فغالبًا تم الدخول بحساب Google مختلف.</p>'}`}catch(e){$('diag').innerHTML=`<p style="color:#a42d2d;font-weight:800">خطأ Firestore: ${esc(e.code||e.message)}</p>`}}
function settingsView(){const mode=localStorage.getItem('roof-mode')||'light';$('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="title">🎨 المظهر</div><div class="field"><label>الوضع</label><select id="mode"><option value="light">فاتح</option><option value="dark">داكن</option><option value="auto">تلقائي</option></select></div><div class="field" style="margin-top:8px"><label>حجم الخط</label><select id="fontSize"><option value="small">صغير</option><option value="medium">متوسط</option><option value="large">كبير</option></select></div><div class="btns" style="margin-top:12px"><button class="btn primary" id="saveSettings">حفظ</button><button class="btn light" onclick="document.getElementById('modalRoot').innerHTML=''">إغلاق</button></div></div></div>`;$('mode').value=mode;$('fontSize').value=localStorage.getItem('roof-font')||'medium';$('saveSettings').onclick=()=>{const m=$('mode').value,f=$('fontSize').value;localStorage.setItem('roof-mode',m);localStorage.setItem('roof-font',f);applySettings();$('modalRoot').innerHTML='';}}
function applySettings(){const m=localStorage.getItem('roof-mode')||'light';document.documentElement.dataset.theme=m;const dark=m==='dark'||(m==='auto'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches);if(dark){document.documentElement.style.setProperty('--bg','#11171c');document.documentElement.style.setProperty('--card','#1c252c');document.documentElement.style.setProperty('--text','#f2f5f7');document.documentElement.style.setProperty('--soft','#26323a');document.documentElement.style.setProperty('--line','#3a4750')}else{document.documentElement.style.removeProperty('--bg');document.documentElement.style.removeProperty('--card');document.documentElement.style.removeProperty('--text');document.documentElement.style.removeProperty('--soft');document.documentElement.style.removeProperty('--line')}const f=localStorage.getItem('roof-font')||'medium';document.body.style.fontSize=f==='small'?'13px':f==='large'?'17px':'15px'}
async function shareInvoice(){
 const inv=calc(collectEditor());
 const choice=prompt('اختر صيغة المشاركة:\n1 = صورة PNG\n2 = PDF','1');
 if(choice!=='1'&&choice!=='2')return;
 const html=buildExport(inv);
 const holder=$('export');holder.innerHTML=html.replace(/^<!doctype html><html[^>]*>|<\/html>|<head>[\\s\\S]*?<\/head>|<body[^>]*>|<\/body>/gi,'');holder.style.left='0';holder.style.top='0';holder.style.zIndex='-1';
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
 try{
   if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
   const canvas=await html2canvas(holder,{scale:2,backgroundColor:'#fff',useCORS:true,width:794});
   const base=safe((inv.customer.name||'فاتورة')+' - '+(inv.invoiceNumber||'مسودة'));
   if(choice==='1'){
      const blob=await new Promise(r=>canvas.toBlob(r,'image/png',1));
      await shareOrDownload(blob,base+'.png','image/png','Roof ART - صورة الفاتورة');
   }else{
      if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
      const img=canvas.toDataURL('image/jpeg',.94), pageW=210, pageH=297, margin=8, usableW=pageW-margin*2, imgH=canvas.height*usableW/canvas.width;
      let y=margin,remain=imgH,srcY=0;
      while(remain>0){const draw=Math.min(remain,pageH-margin-y);const crop=document.createElement('canvas');crop.width=canvas.width;crop.height=Math.max(1,Math.ceil(canvas.height*draw/imgH));crop.getContext('2d').drawImage(canvas,0,srcY,canvas.width,crop.height,0,0,crop.width,crop.height);pdf.addImage(crop.toDataURL('image/jpeg',.94),'JPEG',margin,y,usableW,draw,'FAST');remain-=draw;srcY+=crop.height;if(remain>0){pdf.addPage();y=margin}}
      const blob=pdf.output('blob');await shareOrDownload(blob,base+'.pdf','application/pdf','Roof ART - PDF الفاتورة');
   }
 }catch(e){console.error(e);alert('تعذر تجهيز الملف: '+e.message)}finally{holder.style.left='-100000px';holder.style.zIndex='-1'}
}
async function shareOrDownload(blob,name,type,title){const file=new File([blob],name,{type});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title,files:[file]});return}catch(e){if(e.name==='AbortError')return}}downloadBlob(blob,name)}
