const firebaseConfig={apiKey:'AIzaSyBwr4Z0k0G13g-iRnAKpQfXhbugsU20kvg',authDomain:'wood-art-8a7d6.firebaseapp.com',projectId:'wood-art-8a7d6',storageBucket:'wood-art-8a7d6.firebasestorage.app',messagingSenderId:'362506972779',appId:'1:362506972779:web:d3bd442a754bb832cdcb2e'};
let auth,db,user=null,invoices=[],customers=[],trash=[],editing=null;

function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function renderNav(){const html=navItems().map(([id,ic,t])=>`<button class="side-btn ${id==='home'?'active':''}" data-nav="${id}"><span class="ico">${ic}</span><span>${t}</span></button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=navItems().slice(0,5).map(([id,ic,t])=>`<button data-nav="${id}" class="${id==='home'?'active':''}"><span class="ico">${ic}</span>${t}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>showView(b.dataset.nav));}
function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id)?.classList.add('active');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));if(id==='home')renderHome();if(id==='invoice')renderInvoice();if(id==='invoices')renderInvoices();if(id==='customers')renderCustomers();if(id==='materials')renderMaterials();if(id==='quick')renderQuick();if(id==='settings')renderSettings();if(id==='trash')renderTrash();window.scrollTo({top:0,behavior:'smooth'});}
function normalize(x,id){const legacy=x.rows||x.client||x.number||x.paid!==undefined;const woods=(legacy?(x.rows||[]):(x.woods||[])).map(r=>({count:Number(r.count??r.quantity??1),length:Number(r.length||0),width:Number(r.width||0),thickness:Number(r.thickness||0),unitPrice:Number(r.unitPrice??r.price??0),notes:r.notes??r.note??''}));const mats=(legacy?(x.materials||[]):(x.extraMaterials||x.materials||[])).map(r=>({name:r.name||'',quantity:Number(r.quantity??1),unitPrice:Number(r.unitPrice??r.price??0)}));let mfg=legacy?(typeof x.manufacturing==='number'?[{product:'التصنيع',price:Number(x.manufacturing)}]:(x.manufacturing||[])):(x.manufacturing||[]);if(!Array.isArray(mfg))mfg=[];const payments=legacy?(Number(x.paid||0)>0?[{amount:Number(x.paid),date:x.date||new Date().toISOString().slice(0,10),note:'دفعة مسجلة في الفاتورة القديمة'}]:[]):(x.payments||[]);return {id,invoiceNumber:String(x.invoiceNumber||x.number||''),date:x.date||new Date().toISOString().slice(0,10),customer:{name:x.customer?.name||x.client||'',phone:x.customer?.phone||'',address:x.customer?.address||'',notes:x.customer?.notes||''},woods,mats,manufacturing:mfg,payments,discountType:x.discountType||'amount',discount:Number(x.discount||0),invoiceNotes:x.invoiceNotes||x.notes||'',createdAt:x.createdAt||x.updatedAt||null,updatedAt:x.updatedAt||null,legacy};}
function calc(inv){let woodTotal=0,volume=0;inv.woods.forEach(r=>{const q=Number(r.count||0)*Number(r.length||0)*Number(r.width||0)*Number(r.thickness||0)/1000000;volume+=q;woodTotal+=q*Number(r.unitPrice||0)});let matTotal=inv.mats.reduce((s,r)=>s+Number(r.quantity||0)*Number(r.unitPrice||0),0);let mfgTotal=inv.manufacturing.reduce((s,r)=>s+Number(r.price||0),0);let subtotal=woodTotal+matTotal+mfgTotal;let discount=inv.discountType==='percent'?subtotal*Number(inv.discount||0)/100:Number(inv.discount||0);discount=Math.min(Math.max(discount,0),subtotal);let finalTotal=subtotal-discount;let paid=inv.payments.reduce((s,p)=>s+Number(p.amount||0),0);let remaining=Math.max(finalTotal-paid,0);let status=finalTotal<=0?'draft':paid>=finalTotal?'paid':paid>0?'partial':'unpaid';return {woodTotal,matTotal,mfgTotal,volume,subtotal,discount,finalTotal,paid,remaining,status};}
function emptyInvoice(){return {invoiceNumber:'',date:new Date().toISOString().slice(0,10),customer:{name:'',phone:'',address:'',notes:''},woods:[{count:1,length:0,width:0,thickness:0,unitPrice:0,notes:''}],mats:[],manufacturing:[],payments:[],discountType:'amount',discount:0,invoiceNotes:''}}

function invoiceCard(i){const c=calc(i);return `<div class="invoice-card"><div><strong>فاتورة ${esc(i.invoiceNumber)}</strong><span class="muted">${esc(i.customer.name||'بدون اسم')}</span></div><div>${money(c.finalTotal)} ج</div><div><span class="status s-${c.status}">${({paid:'مدفوعة بالكامل',partial:'مدفوعة جزئيًا',unpaid:'غير مدفوعة',draft:'مسودة'})[c.status]}</span></div><div class="actions"><button class="btn gold" onclick="editInvoice('${i.id}')">فتح</button><button class="btn" onclick="copyInvoice('${i.id}')">نسخ</button></div></div>`}
function renderInvoice(){const i=editing||emptyInvoice();if(!i.invoiceNumber)i.invoiceNumber=nextNumber();const c=calc(i);document.getElementById('invoice').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>${editing?'تعديل الفاتورة':'فاتورة جديدة'}</h2><span class="muted">رقم الفاتورة: ${esc(i.invoiceNumber)}</span></div><div class="actions"><button class="btn" onclick="showView('invoices')">إلغاء</button><button class="btn primary" onclick="saveInvoice()">💾 حفظ الفاتورة</button></div></div><div class="section-title"><span>1</span> بيانات العميل</div><div class="form-grid"><div class="field"><label>اسم العميل</label><input id="cname" value="${esc(i.customer.name)}"></div><div class="field"><label>رقم الهاتف</label><input id="cphone" inputmode="tel" value="${esc(i.customer.phone)}"></div><div class="field"><label>العنوان</label><input id="caddress" value="${esc(i.customer.address)}"></div><div class="field"><label>التاريخ</label><input id="idate" type="date" value="${esc(i.date)}"></div><div class="field wide"><label>ملاحظات العميل</label><textarea id="cnotes">${esc(i.customer.notes)}</textarea></div></div></div><div class="panel"><div class="section-title"><span>2</span> الأخشاب</div><div class="table-wrap"><table class="data-table"><thead><tr><th>م</th><th>العدد</th><th>الطول سم</th><th>العرض سم</th><th>السمك سم</th><th>الكمية م³</th><th>سعر م³</th><th>الإجمالي</th><th>ملاحظات</th><th>حذف</th></tr></thead><tbody id="woodBody"></tbody></table></div><div class="actions"><button class="btn gold" onclick="addWood()">+ إضافة صف</button></div></div><div class="panel"><div class="section-title"><span>3</span> الخامات الإضافية</div><div class="table-wrap"><table class="data-table" style="min-width:650px"><thead><tr><th>م</th><th>الصنف</th><th>العدد</th><th>سعر الوحدة</th><th>الإجمالي</th><th>حذف</th></tr></thead><tbody id="matBody"></tbody></table></div><div class="actions"><button class="btn gold" onclick="addMat()">+ إضافة خامة</button></div></div><div class="panel"><div class="section-title"><span>4</span> التصنيع</div><div class="table-wrap"><table class="data-table" style="min-width:600px"><thead><tr><th>م</th><th>البند / المنتج</th><th>قيمة التصنيع</th><th>حذف</th></tr></thead><tbody id="mfgBody"></tbody></table></div><div class="actions"><button class="btn gold" onclick="addMfg()">+ إضافة بند تصنيع</button></div></div><div class="panel"><div class="section-title"><span>5</span> الخصم</div><div class="form-grid"><div class="field"><label>نوع الخصم</label><select id="dtype"><option value="amount" ${i.discountType==='amount'?'selected':''}>قيمة</option><option value="percent" ${i.discountType==='percent'?'selected':''}>نسبة %</option></select></div><div class="field"><label>الخصم</label><input id="discount" type="number" step="0.01" value="${i.discount||0}"></div></div></div><div class="panel"><div class="section-title"><span>6</span> الدفعات <small class="muted">تُسجل قبل الإجمالي النهائي</small></div><div id="paymentsBox" class="payments"></div><div class="actions"><button class="btn gold" onclick="addPayment()">+ إضافة دفعة</button></div></div><div class="panel"><div class="section-title"><span>7</span> الإجمالي النهائي</div><div class="invoice-summary"><div class="summary-list"><div class="sum-row"><span>الأخشاب</span><b id="tWood">${money(c.woodTotal)}</b></div><div class="sum-row"><span>الخامات</span><b id="tMat">${money(c.matTotal)}</b></div><div class="sum-row"><span>التصنيع</span><b id="tMfg">${money(c.mfgTotal)}</b></div><div class="sum-row"><span>الإجمالي قبل الخصم</span><b id="tSub">${money(c.subtotal)}</b></div><div class="sum-row"><span>الخصم</span><b id="tDisc">${money(c.discount)}</b></div><div class="sum-row final"><span>الإجمالي النهائي</span><b id="tFinal">${money(c.finalTotal)}</b></div><div class="sum-row"><span>إجمالي المدفوع</span><b id="tPaid">${money(c.paid)}</b></div><div class="sum-row"><span>المتبقي</span><b id="tRem">${money(c.remaining)}</b></div></div><div class="field"><label>ملاحظات الفاتورة</label><textarea id="inotes" style="height:100%">${esc(i.invoiceNotes)}</textarea></div></div><div class="actions"><button class="btn primary" onclick="saveInvoice()">💾 حفظ</button><button class="btn" onclick="exportInvoice('pdf')">📄 PDF</button><button class="btn" onclick="exportInvoice('image')">🖼️ صورة</button></div></div>`;renderWoodRows();renderMatRows();renderMfgRows();renderPayments();}
function renderWoodRows(){const i=editing||window.draftInvoice;if(!i)return;document.getElementById('woodBody').innerHTML=i.woods.map((r,n)=>{const q=Number(r.count||0)*Number(r.length||0)*Number(r.width||0)*Number(r.thickness||0)/1000000;return `<tr><td>${n+1}</td><td><input type="number" data-w="count" data-i="${n}" value="${r.count}"></td><td><input type="number" data-w="length" data-i="${n}" value="${r.length}"></td><td><input type="number" data-w="width" data-i="${n}" value="${r.width}"></td><td><input type="number" data-w="thickness" data-i="${n}" value="${r.thickness}"></td><td>${q.toFixed(3)}</td><td><input type="number" data-w="unitPrice" data-i="${n}" value="${r.unitPrice}"></td><td>${money(q*r.unitPrice)}</td><td><input data-w="notes" data-i="${n}" value="${esc(r.notes)}"></td><td><button class="btn danger" onclick="removeWood(${n})">×</button></td></tr>`}).join('');document.querySelectorAll('[data-w]').forEach(el=>el.oninput=()=>{const n=+el.dataset.i; (editing||window.draftInvoice).woods[n][el.dataset.w]=el.type==='number'?Number(el.value):el.value;refreshTotals();});}
function renderMatRows(){const i=editing||window.draftInvoice;document.getElementById('matBody').innerHTML=i.mats.map((r,n)=>`<tr><td>${n+1}</td><td><input data-m="name" data-i="${n}" value="${esc(r.name)}"></td><td><input type="number" data-m="quantity" data-i="${n}" value="${r.quantity}"></td><td><input type="number" data-m="unitPrice" data-i="${n}" value="${r.unitPrice}"></td><td>${money(r.quantity*r.unitPrice)}</td><td><button class="btn danger" onclick="removeMat(${n})">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد خامات</td></tr>';document.querySelectorAll('[data-m]').forEach(el=>el.oninput=()=>{const n=+el.dataset.i;(editing||window.draftInvoice).mats[n][el.dataset.m]=el.type==='number'?Number(el.value):el.value;refreshTotals();});}
function renderMfgRows(){const i=editing||window.draftInvoice;document.getElementById('mfgBody').innerHTML=i.manufacturing.map((r,n)=>`<tr><td>${n+1}</td><td><input data-f="product" data-i="${n}" value="${esc(r.product||'')}"></td><td><input type="number" data-f="price" data-i="${n}" value="${r.price||0}"></td><td><button class="btn danger" onclick="removeMfg(${n})">×</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا يوجد تصنيع</td></tr>';document.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{const n=+el.dataset.i;(editing||window.draftInvoice).manufacturing[n][el.dataset.f]=el.type==='number'?Number(el.value):el.value;refreshTotals();});}
function renderPayments(){const i=editing||window.draftInvoice;document.getElementById('paymentsBox').innerHTML=i.payments.map((p,n)=>`<div class="payment-row"><input type="number" data-p="amount" data-i="${n}" value="${p.amount||0}" placeholder="المبلغ"><input type="date" data-p="date" data-i="${n}" value="${p.date||new Date().toISOString().slice(0,10)}"><input data-p="note" data-i="${n}" value="${esc(p.note||'')}" placeholder="ملاحظة الدفعة"><button class="btn danger" onclick="removePayment(${n})">×</button></div>`).join('')||'<div class="empty">لا توجد دفعات مسجلة</div>';document.querySelectorAll('[data-p]').forEach(el=>el.oninput=()=>{const n=+el.dataset.i;(editing||window.draftInvoice).payments[n][el.dataset.p]=el.type==='number'?Number(el.value):el.value;refreshTotals();});}
function addWood(){(editing||window.draftInvoice).woods.push({count:1,length:0,width:0,thickness:0,unitPrice:0,notes:''});renderWoodRows()}function removeWood(n){(editing||window.draftInvoice).woods.splice(n,1);renderWoodRows();refreshTotals()}function addMat(){(editing||window.draftInvoice).mats.push({name:'',quantity:1,unitPrice:0});renderMatRows()}function removeMat(n){(editing||window.draftInvoice).mats.splice(n,1);renderMatRows();refreshTotals()}function addMfg(){(editing||window.draftInvoice).manufacturing.push({product:'',price:0});renderMfgRows()}function removeMfg(n){(editing||window.draftInvoice).manufacturing.splice(n,1);renderMfgRows();refreshTotals()}function addPayment(){(editing||window.draftInvoice).payments.push({amount:0,date:new Date().toISOString().slice(0,10),note:''});renderPayments()}function removePayment(n){(editing||window.draftInvoice).payments.splice(n,1);renderPayments();refreshTotals()}
function readInvoiceForm(){const i=editing||window.draftInvoice;i.customer={name:document.getElementById('cname').value.trim(),phone:document.getElementById('cphone').value.trim(),address:document.getElementById('caddress').value.trim(),notes:document.getElementById('cnotes').value.trim()};i.date=document.getElementById('idate').value;i.discountType=document.getElementById('dtype').value;i.discount=Number(document.getElementById('discount').value||0);i.invoiceNotes=document.getElementById('inotes').value.trim();return i}
function refreshTotals(){if(!document.getElementById('tFinal'))return;const i=readInvoiceForm();const c=calc(i);['tWood','tMat','tMfg','tSub','tDisc','tFinal','tPaid','tRem'].forEach((id,k)=>document.getElementById(id).textContent=money([c.woodTotal,c.matTotal,c.mfgTotal,c.subtotal,c.discount,c.finalTotal,c.paid,c.remaining][k]));}
async function saveInvoice(){try{const i=readInvoiceForm();if(!i.customer.name){toast('اكتب اسم العميل أولًا');return}if(!i.invoiceNumber)i.invoiceNumber=nextNumber();const c=calc(i);const data={...i,customer:i.customer,woods:i.woods,extraMaterials:i.mats,manufacturing:i.manufacturing,payments:i.payments,discount:i.discount,discountType:i.discountType,invoiceNotes:i.invoiceNotes,woodTotal:c.woodTotal,materialsTotal:c.matTotal,manufacturingTotal:c.mfgTotal,finalTotal:c.finalTotal,remaining:c.remaining,paid:c.paid,totalVolume:c.volume,status:c.status,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:editing?.createdAt||firebase.firestore.FieldValue.serverTimestamp()};if(editing?.id){await path('invoices').doc(editing.id).set(data,{merge:true});toast('تم حفظ الفاتورة');}else{await path('invoices').doc().set(data);toast('تم حفظ الفاتورة');}editing=null;window.draftInvoice=null;await loadData();showView('invoices');}catch(e){toast('فشل الحفظ: '+e.message);console.error(e)}}
function editInvoice(id){const x=invoices.find(i=>i.id===id);if(!x)return;editing=JSON.parse(JSON.stringify(x));window.draftInvoice=editing;showView('invoice')}
function newInvoice(){editing=null;window.draftInvoice=emptyInvoice();window.draftInvoice.invoiceNumber=nextNumber();showView('invoice')}
function copyInvoice(id){const x=invoices.find(i=>i.id===id);if(!x)return;editing=null;window.draftInvoice=JSON.parse(JSON.stringify(x));window.draftInvoice.id=undefined;window.draftInvoice.invoiceNumber=nextNumber();window.draftInvoice.date=new Date().toISOString().slice(0,10);window.draftInvoice.payments=[];showView('invoice')}
async function moveTrash(id){const x=invoices.find(i=>i.id===id);if(!x||!confirm('نقل الفاتورة إلى سلة المحذوفات؟'))return;await path('trash').doc(id).set({...x,deletedAt:new Date().toISOString()});await path('invoices').doc(id).delete();await loadData();toast('تم نقل الفاتورة للسلة')}
async function restoreTrash(id){const x=trash.find(i=>i.id===id);if(!x)return;const data={...x};delete data.id;delete data.deletedAt;await path('invoices').doc(id).set(data);await path('trash').doc(id).delete();await loadData();toast('تمت الاستعادة')}
async function permanentDelete(id){if(!confirm('حذف نهائي؟ لا يمكن التراجع.'))return;await path('trash').doc(id).delete();trash=trash.filter(x=>x.id!==id);renderTrash();toast('تم الحذف النهائي')}
async function emptyTrash(){if(!trash.length)return;if(!confirm('إفراغ السلة نهائيًا؟'))return;const batch=db.batch();trash.forEach(x=>batch.delete(path('trash').doc(x.id)));await batch.commit();trash=[];renderTrash();toast('تم إفراغ السلة')}
function renderInvoices(){document.getElementById('invoices').innerHTML=`<div class="panel"><div class="panel-head"><h2>الفواتير</h2><button class="btn primary" onclick="newInvoice()">+ فاتورة جديدة</button></div><div class="searchbar"><input id="invSearch" placeholder="بحث برقم الفاتورة أو العميل أو الهاتف"><select id="invFilter"><option value="all">كل الحالات</option><option value="paid">مدفوعة بالكامل</option><option value="partial">مدفوعة جزئيًا</option><option value="unpaid">غير مدفوعة</option><option value="draft">مسودة</option></select></div></div><div id="invoiceList" class="list"></div>`;const draw=()=>{const q=(document.getElementById('invSearch').value||'').toLowerCase();const f=document.getElementById('invFilter').value;document.getElementById('invoiceList').innerHTML=invoices.filter(i=>(!q||`${i.invoiceNumber} ${i.customer.name} ${i.customer.phone}`.toLowerCase().includes(q))&&(f==='all'||calc(i).status===f)).map(i=>`<div class="invoice-card"><div><strong>فاتورة ${esc(i.invoiceNumber)}</strong><span class="muted">${esc(i.customer.name||'بدون اسم')} • ${esc(i.date)}</span></div><div>${money(calc(i).finalTotal)} ج</div><div><span class="status s-${calc(i).status}">${({paid:'مدفوعة بالكامل',partial:'مدفوعة جزئيًا',unpaid:'غير مدفوعة',draft:'مسودة'})[calc(i).status]}</span></div><div class="actions"><button class="btn gold" onclick="editInvoice('${i.id}')">فتح</button><button class="btn" onclick="copyInvoice('${i.id}')">نسخ</button><button class="btn danger" onclick="moveTrash('${i.id}')">حذف</button></div></div>`).join('')||'<div class="panel empty">لا توجد فواتير مطابقة</div>'};document.getElementById('invSearch').oninput=draw;document.getElementById('invFilter').onchange=draw;draw()}
function renderCustomers(){const map={};invoices.forEach(i=>{const k=i.customer.name||'بدون اسم';if(!map[k])map[k]={name:k,phone:i.customer.phone||'',total:0,paid:0,rem:0,count:0};const c=calc(i);map[k].total+=c.finalTotal;map[k].paid+=c.paid;map[k].rem+=c.remaining;map[k].count++});const arr=Object.values(map);document.getElementById('customers').innerHTML=`<div class="panel"><div class="panel-head"><h2>حسابات العملاء</h2><button class="btn" onclick="newInvoice()">+ فاتورة لعميل</button></div><div class="searchbar"><input id="custSearch" placeholder="بحث بالاسم أو الهاتف"></div></div><div id="custList" class="list"></div>`;const draw=()=>{const q=(document.getElementById('custSearch').value||'').toLowerCase();document.getElementById('custList').innerHTML=arr.filter(x=>`${x.name} ${x.phone}`.toLowerCase().includes(q)).map(x=>`<div class="customer-card"><div><strong>${esc(x.name)}</strong><span class="muted">${esc(x.phone||'بدون هاتف')}</span></div><div>${x.count} فاتورة<br><span class="muted">الإجمالي ${money(x.total)}</span></div><div>مدفوع ${money(x.paid)}<br><b>متبقي ${money(x.rem)}</b></div><div class="actions">${x.phone?`<a class="btn" href="tel:${esc(x.phone)}">اتصال</a><a class="btn" target="_blank" href="https://wa.me/2${x.phone.replace(/^0/,'')}">واتساب</a>`:''}</div></div>`).join('')||'<div class="panel empty">لا يوجد عملاء</div>'};document.getElementById('custSearch').oninput=draw;draw()}
function renderMaterials(){document.getElementById('materials').innerHTML=`<div class="panel"><div class="panel-head"><h2>المواد الخام والمكتبات</h2><button class="btn primary" onclick="addLibraryItem()">+ إضافة صنف</button></div><div class="settings-grid"><div class="setting-card"><h3>خامات إضافية</h3><p class="muted">مفصلات، مقابض، مسامير، غراء، سيليكون، إكسسوارات، صنفرة وغيرها.</p><div id="matLib"></div></div><div class="setting-card"><h3>التصنيع</h3><p class="muted">مكتبة أعمال التصنيع وأسعارها.</p><div id="mfgLib"></div></div></div></div>`;const libs=JSON.parse(localStorage.getItem('roofart_libs')||'{"materials":[],"mfg":[]}');document.getElementById('matLib').innerHTML=libs.materials.map((x,n)=>`<div class="sum-row"><span>${esc(x.name)}</span><b>${money(x.price)}</b><button class="btn danger" onclick="delLib('materials',${n})">×</button></div>`).join('')||'<div class="empty">لا توجد أصناف</div>';document.getElementById('mfgLib').innerHTML=libs.mfg.map((x,n)=>`<div class="sum-row"><span>${esc(x.name)}</span><b>${money(x.price)}</b><button class="btn danger" onclick="delLib('mfg',${n})">×</button></div>`).join('')||'<div class="empty">لا توجد أعمال</div>'}
function addLibraryItem(){const type=prompt('اكتب: خامات أو تصنيع');if(!type)return;const name=prompt('اسم الصنف');if(!name)return;const price=Number(prompt('السعر الافتراضي')||0);const libs=JSON.parse(localStorage.getItem('roofart_libs')||'{"materials":[],"mfg":[]}');(type.includes('تصنيع')?libs.mfg:libs.materials).push({name,price});localStorage.setItem('roofart_libs',JSON.stringify(libs));renderMaterials()}
function delLib(type,n){const libs=JSON.parse(localStorage.getItem('roofart_libs')||'{"materials":[],"mfg":[]}');libs[type].splice(n,1);localStorage.setItem('roofart_libs',JSON.stringify(libs));renderMaterials()}
function renderQuick(){window.quick=window.quick||emptyInvoice();document.getElementById('quick').innerHTML=`<div class="panel"><div class="panel-head"><h2>⚡ الحساب السريع</h2><button class="btn primary" onclick="convertQuick()">تحويل إلى فاتورة</button></div><p class="muted">حساب بدون عميل أو رقم فاتورة. يمكنك تحويل النتيجة لاحقًا إلى فاتورة.</p><div class="section-title"><span>1</span> الأخشاب</div><div class="table-wrap"><table class="data-table"><thead><tr><th>م</th><th>العدد</th><th>الطول</th><th>العرض</th><th>السمك</th><th>سعر م³</th><th>الإجمالي</th></tr></thead><tbody>${window.quick.woods.map((r,n)=>{const q=r.count*r.length*r.width*r.thickness/1000000;return `<tr><td>${n+1}</td><td>${r.count}</td><td>${r.length}</td><td>${r.width}</td><td>${r.thickness}</td><td>${money(r.unitPrice)}</td><td>${money(q*r.unitPrice)}</td></tr>`}).join('')}</tbody></table></div><div class="actions"><button class="btn gold" onclick="window.quick.woods.push({count:1,length:0,width:0,thickness:0,unitPrice:0,notes:''});renderQuick()">+ صف خشب</button></div><div class="totals"><div class="total-box grand"><span>إجمالي الأخشاب</span><strong>${money(calc(window.quick).woodTotal)}</strong></div></div></div>`}
function convertQuick(){window.draftInvoice=JSON.parse(JSON.stringify(window.quick));window.draftInvoice.invoiceNumber=nextNumber();window.draftInvoice.customer={name:'',phone:'',address:'',notes:''};window.draftInvoice.payments=[];editing=null;showView('invoice')}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="panel"><h2>الإعدادات</h2><div class="settings-grid"><div class="setting-card"><h3>المظهر</h3><div class="actions"><button class="btn" onclick="setTheme('light')">فاتح</button><button class="btn" onclick="setTheme('dark')">داكن</button><button class="btn" onclick="setTheme('auto')">تلقائي</button></div><p class="muted">حجم الخط</p><div class="actions"><button class="btn" onclick="setFont('small')">صغير</button><button class="btn" onclick="setFont('medium')">متوسط</button><button class="btn" onclick="setFont('large')">كبير</button></div></div><div class="setting-card"><h3>النسخ الاحتياطي والاستعادة</h3><button class="btn primary" onclick="backup()">تصدير نسخة احتياطية</button><input type="file" id="restoreFile" accept="application/json" style="margin-top:10px"><button class="btn" onclick="restoreBackup()">استعادة</button></div><div class="setting-card"><h3>شريط الإجمالي الثابت</h3><button class="btn" onclick="localStorage.setItem('roofart_fixed',localStorage.getItem('roofart_fixed')==='1'?'0':'1');toast('تم تغيير الإعداد')">تفعيل / إيقاف</button><p class="muted">اختياري ومغلق افتراضيًا.</p></div><div class="setting-card"><h3>الحساب والمزامنة</h3><p>حساب Google: ${esc(user?.email||'')}</p><p class="muted">النسخة الحالية تعمل Online/Offline حسب إمكانيات المتصفح وFirebase، وتستخدم نفس حساب البيانات.</p></div></div></div>`}
function setTheme(t){document.documentElement.dataset.theme=t;document.body.style.background=t==='dark'?'#0e151b':getComputedStyle(document.documentElement).getPropertyValue('--bg');if(t==='dark'){document.documentElement.style.setProperty('--bg','#0e151b');document.documentElement.style.setProperty('--card','#18232d');document.documentElement.style.setProperty('--ink','#eef3f6');document.documentElement.style.setProperty('--line','#34424e')}else{document.documentElement.style.setProperty('--bg','#eef1f3');document.documentElement.style.setProperty('--card','#fff');document.documentElement.style.setProperty('--ink','#17212b');document.documentElement.style.setProperty('--line','#d9dde1')}localStorage.setItem('roofart_theme',t)}
function setFont(s){document.documentElement.style.fontSize=s==='small'?'14px':s==='large'?'18px':'16px';localStorage.setItem('roofart_font',s)}
function renderTrash(){document.getElementById('trash').innerHTML=`<div class="panel"><div class="panel-head"><h2>🗑️ سلة المحذوفات</h2><button class="btn danger" onclick="emptyTrash()">إفراغ السلة</button></div><div class="list">${trash.map(x=>`<div class="invoice-card"><div><strong>فاتورة ${esc(x.invoiceNumber)}</strong><span class="muted">${esc(x.customer?.name||'')}</span></div><div>${esc(x.date||'')}</div><div>محذوفة</div><div class="actions"><button class="btn" onclick="restoreTrash('${x.id}')">استعادة</button><button class="btn danger" onclick="permanentDelete('${x.id}')">حذف نهائي</button></div></div>`).join('')||'<div class="empty">السلة فارغة</div>'}</div></div>`}
function invoiceHtml(i){const c=calc(i);return `<div style="width:794px;background:#fff;color:#17212b;padding:34px;font-family:Tahoma,Arial,sans-serif;direction:rtl"><div style="border-bottom:5px solid #b98543;padding-bottom:16px;text-align:center"><div style="font-size:48px;font-weight:900;letter-spacing:-3px">Roof ART</div><div style="font-size:16px;margin-top:4px">فن تصنيع الأخشاب</div><div style="color:#8d5c26;font-weight:800;margin-top:5px">خبرة • إتقان • تميّز</div><div style="font-size:18px;font-weight:900;margin-top:12px">تصميم وتنفيذ أعمال الروف والديكورات الخشبية</div><div style="font-size:12px;margin-top:7px">تجاليد حوائط • برجولات • أسوار حدائق • أرضيات باركيه • سلالم خشبية</div></div><div style="display:flex;justify-content:space-between;margin:18px 0"><div><b>بيانات العميل</b><br>الاسم: ${esc(i.customer.name)}<br>الهاتف: ${esc(i.customer.phone)}<br>العنوان: ${esc(i.customer.address)}</div><div><b>فاتورة رقم</b><br><span style="font-size:22px;font-weight:900">${esc(i.invoiceNumber)}</span><br>التاريخ: ${esc(i.date)}</div></div><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#17212b;color:#fff"><th style="padding:8px">م</th><th>النوع</th><th>التفاصيل</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${i.woods.map((r,n)=>{const q=r.count*r.length*r.width*r.thickness/1000000;return `<tr><td style="border:1px solid #ddd;padding:7px">${n+1}</td><td style="border:1px solid #ddd;padding:7px">أخشاب</td><td style="border:1px solid #ddd;padding:7px">${r.length}×${r.width}×${r.thickness} سم</td><td style="border:1px solid #ddd;padding:7px">${r.count} / ${q.toFixed(3)} م³</td><td style="border:1px solid #ddd;padding:7px">${money(r.unitPrice)}</td><td style="border:1px solid #ddd;padding:7px">${money(q*r.unitPrice)}</td></tr>`}).join('')}${i.mats.map((r,n)=>`<tr><td style="border:1px solid #ddd;padding:7px">${n+1}</td><td style="border:1px solid #ddd;padding:7px">خامات</td><td style="border:1px solid #ddd;padding:7px">${esc(r.name)}</td><td style="border:1px solid #ddd;padding:7px">${r.quantity}</td><td style="border:1px solid #ddd;padding:7px">${money(r.unitPrice)}</td><td style="border:1px solid #ddd;padding:7px">${money(r.quantity*r.unitPrice)}</td></tr>`).join('')}${i.manufacturing.map((r,n)=>`<tr><td style="border:1px solid #ddd;padding:7px">${n+1}</td><td style="border:1px solid #ddd;padding:7px">تصنيع</td><td style="border:1px solid #ddd;padding:7px">${esc(r.product)}</td><td style="border:1px solid #ddd;padding:7px">1</td><td style="border:1px solid #ddd;padding:7px">${money(r.price)}</td><td style="border:1px solid #ddd;padding:7px">${money(r.price)}</td></tr>`).join('')}</tbody></table><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px"><div style="border:1px solid #ddd;padding:12px"><b>الدفعات</b>${i.payments.map(p=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0"><span>${esc(p.date)} — ${esc(p.note||'دفعة')}</span><b>${money(p.amount)} ج</b></div>`).join('')||'<div style="padding:7px 0">لا توجد دفعات</div>'}</div><div style="border:1px solid #ddd;padding:12px"><div>الأخشاب: ${money(c.woodTotal)}</div><div>الخامات: ${money(c.matTotal)}</div><div>التصنيع: ${money(c.mfgTotal)}</div><div>قبل الخصم: ${money(c.subtotal)}</div><div>الخصم: ${money(c.discount)}</div><div style="font-size:18px;font-weight:900;margin-top:6px">الإجمالي النهائي: ${money(c.finalTotal)} ج</div><div>إجمالي المدفوع: ${money(c.paid)} ج</div><div style="font-size:17px;font-weight:900">المتبقي: ${money(c.remaining)} ج</div></div></div><div style="margin-top:15px;border:1px solid #ddd;padding:12px"><b>ملاحظات</b><div>${esc(i.invoiceNotes||'')}</div></div><div style="margin-top:20px;border-top:2px solid #b98543;padding-top:12px;display:flex;justify-content:space-between;font-size:12px"><div>الحاج محمد مخلوف<br>01006772347</div><div>أ/ محمد البرجيسي<br>01013775022<br>InstaPay • Vodafone Cash</div></div></div>`}
async function exportInvoice(type){try{const i=readInvoiceForm();if(!i.customer.name){toast('اكتب اسم العميل أولًا');return}const holder=document.createElement('div');holder.style.position='fixed';holder.style.left='-10000px';holder.style.top='0';holder.innerHTML=invoiceHtml(i);document.body.appendChild(holder);const el=holder.firstElementChild;const canvas=await html2canvas(el,{scale:2,backgroundColor:'#fff',useCORS:true});const filename=`${i.customer.name} - فاتورة ${i.invoiceNumber}`;if(type==='image'){const a=document.createElement('a');a.download=filename+'.png';a.href=canvas.toDataURL('image/png');a.click()}else{const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const img=canvas.toDataURL('image/jpeg',.95);const w=190,h=canvas.height*w/canvas.width;pdf.addImage(img,'JPEG',10,10,w,Math.min(h,277));pdf.save(filename+'.pdf')}holder.remove();toast('تم تجهيز الملف')}catch(e){toast('فشل التصدير: '+e.message)}}
function backup(){const data={invoices,customers,trash,exportedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='Roof-ART-Backup.json';a.click()}
async function restoreBackup(){const f=document.getElementById('restoreFile').files[0];if(!f)return toast('اختر ملف النسخة الاحتياطية');const data=JSON.parse(await f.text());if(!confirm('سيتم إضافة الفواتير والعملاء إلى الحساب الحالي. متابعة؟'))return;for(const i of (data.invoices||[])){const id=i.id||path('invoices').doc().id;const x={...i};delete x.id;await path('invoices').doc(id).set(x,{merge:true})}for(const c of (data.customers||[])){const id=c.id||path('customers').doc().id;const x={...c};delete x.id;await path('customers').doc(id).set(x,{merge:true})}await loadData();toast('تمت الاستعادة')}
async function signOut(){await auth.signOut()}
function init(){try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});auth.onAuthStateChanged(async u=>{user=u;if(u){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userName').textContent=u.displayName||u.email||'';renderNav();await loadData();showView('home');}else{document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}});document.getElementById('loginBtn').onclick=async()=>{try{document.getElementById('loginMsg').textContent='جاري تسجيل الدخول...';await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){document.getElementById('loginMsg').textContent='تعذر تسجيل الدخول: '+e.message}};const th=localStorage.getItem('roofart_theme');if(th)setTheme(th);const fs=localStorage.getItem('roofart_font');if(fs)setFont(fs)}catch(e){document.getElementById('loginMsg').textContent='خطأ تشغيل: '+e.message}}
init();
</script></body></html>
