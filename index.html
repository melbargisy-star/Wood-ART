<style>

*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding-bottom:78px}.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:12px 14px;box-shadow:0 2px 10px #0002}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:900;font-size:25px;letter-spacing:.5px}.tag{font-size:11px;color:#ddd}.sync{font-size:11px;padding:6px 9px;border-radius:20px;background:#ffffff18}.sync.ok{background:#16835b}.sync.off{background:#8a5b16}.card{background:var(--card);margin:9px;padding:12px;border-radius:13px;box-shadow:var(--shadow)}.title{font-weight:900;font-size:16px;margin-bottom:10px;color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff;outline:none}.field textarea{min-height:70px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand2)}.span2{grid-column:span 2}.span4{grid-column:span 4}.btns{display:flex;flex-wrap:wrap;gap:7px}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700}.primary{background:var(--brand);color:#fff}.gold{background:var(--brand2);color:#fff}.light{background:var(--soft);color:var(--text)}.danger{background:#f9e5e5;color:#a52d2d}.small{padding:6px 9px;font-size:12px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}.table{width:100%;border-collapse:collapse;min-width:850px;direction:rtl}.table th{background:var(--soft);font-size:11px;padding:7px;border:1px solid var(--line);white-space:nowrap}.table td{padding:3px;border:1px solid var(--line);text-align:center}.table input{width:100%;min-width:55px;border:0;text-align:center;padding:7px;background:transparent;outline:none}.table input:focus{background:#fff7e7}.total-line{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:9px;margin-top:9px;font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--soft);border-radius:10px;padding:10px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;margin-top:4px;font-size:16px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}.bottom-inner{max-width:700px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;padding:9px 3px;font-size:10px;color:var(--muted)}.nav.active{color:var(--brand);font-weight:900}.nav span{display:block;font-size:19px;margin-bottom:2px}.hidden{display:none!important}.muted{color:var(--muted);font-size:12px}.row-actions{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.badge{display:inline-block;padding:4px 7px;border-radius:12px;font-size:10px;font-weight:700}.paid{background:#dff5ea;color:#08764d}.partial{background:#fff0cc;color:#9a6500}.unpaid{background:#f9dddd;color:#a42d2d}.draft{background:#e5e8eb;color:#5c6670}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}.modalbox{background:#fff;border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:16px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 15px;border-radius:9px;z-index:80;font-size:12px}.empty{text-align:center;color:var(--muted);padding:22px}.export{position:absolute;left:-100000px;top:0;width:794px;background:#fff;padding:35px;color:#17212b}.export h1{margin:0}.export .brandline{border-bottom:3px solid #17212b;padding-bottom:12px;margin-bottom:15px}.export table{width:100%;border-collapse:collapse;margin:10px 0}.export th,.export td{border:1px solid #bbb;padding:6px;font-size:11px;text-align:center}.export th{background:#eee}.export .sum{width:340px;margin-right:auto}.export .sum div{display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #ddd}.export .contacts{text-align:right;margin-top:20px;border-top:1px solid #ddd;padding-top:12px;font-size:11px}.login{min-height:65vh;display:flex;align-items:center;justify-content:center}.loginbox{text-align:center;max-width:430px}.loginlogo{font-size:42px;font-weight:900}.divider{height:1px;background:var(--line);margin:10px 0}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span4{grid-column:span 2}.span2{grid-column:span 1}.summary{grid-template-columns:repeat(2,1fr)}.card{margin:6px;padding:9px}.top{padding:10px}.logo{font-size:22px}}
</style>

<body>
<div id="app"><main class="app login"><section class="card loginbox"><div class="loginlogo">Roof ART</div><div class="title">فن تصنيع الأخشاب</div><p class="muted">جاري تشغيل البرنامج…</p></section></main></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>


const firebaseConfig={apiKey:'AIzaSyBwr4Z0k0G13g-iRnAKpQfXhbugsU20kvg',authDomain:'wood-art-8a7d6.firebaseapp.com',projectId:'wood-art-8a7d6',storageBucket:'wood-art-8a7d6.firebasestorage.app',messagingSenderId:'362506972779',appId:'1:362506972779:web:d3bd442a754bb832cdcb2e'};
firebase.initializeApp(firebaseConfig);
const app=firebase.app();
const auth=firebase.auth();
const db=firebase.firestore();
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
auth.useDeviceLanguage();
const provider=new firebase.auth.GoogleAuthProvider();
const initializeApp=()=>app;
const getAuth=()=>auth;
const getFirestore=()=>db;
const GoogleAuthProvider=()=>provider;
const signInWithPopup=(a,p)=>a.signInWithPopup(p);
const onAuthStateChanged=(a,cb)=>a.onAuthStateChanged(cb);
const signOut=a=>a.signOut();
const collection=(...args)=>db.collection(args.slice(1).join('/'));
const doc=(...args)=>{if(args[0]===db)return db.doc(args.slice(1).join('/')); return args[0].doc(args.slice(1).join('/'));};
const getDoc=r=>r.get();
const getDocs=r=>r.get();
const setDoc=(r,data,opts)=>r.set(data,opts||{});
const addDoc=(r,data)=>r.add(data);
const deleteDoc=r=>r.delete();
const orderBy=(field,dir)=>({field,dir});
const query=(r,...clauses)=>clauses.reduce((q,c)=>c&&c.field?q.orderBy(c.field,c.dir):q,r);
const runTransaction=(d,fn)=>d.runTransaction(fn);
const serverTimestamp=()=>firebase.firestore.FieldValue.serverTimestamp();
const writeBatch=()=>db.batch();

let user=null, invoices=[], customers=[], activeView='home', editingId=null, draftTimer=null;
const $=id=>document.getElementById(id); const n=v=>Number(v)||0; const money=v=>n(v).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const safe=s=>String(s||'فاتورة Roof ART').trim().replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').slice(0,100)||'فاتورة Roof ART';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toastRoot').append(d);setTimeout(()=>d.remove(),2500)}
function userRef(){return doc(db,'users',user.uid)} function sub(name){return collection(db,'users',user.uid,name)}
function setSync(text,cls=''){const el=$('sync');if(el){el.textContent=text;el.className='sync '+cls}}
function draftKey(){return 'roofart-draft-'+(user?.uid||'guest')}
function blankInvoice(){return {invoiceNumber:'',customer:{id:'',name:'',phone:'',address:'',notes:''},date:new Date().toISOString().slice(0,10),woods:[blankWood()],extraMaterials:[blankMaterial()],manufacturing:[blankManufacturing()],discount:{type:'amount',value:0},payments:[],invoiceNotes:'',status:'draft'}}
function blankWood(){return {count:'',length:'',width:'',thickness:'',quantityM3:0,unitPrice:'',total:0,notes:''}}
function blankMaterial(){return {name:'',quantity:'',unitPrice:'',total:0}}
function blankManufacturing(){return {product:'',price:''}}
function calc(inv){inv.woods=(inv.woods||[]).map(r=>{const q=n(r.count)*n(r.length)*n(r.width)*n(r.thickness)/1000000;return {...r,quantityM3:q,total:q*n(r.unitPrice)}});inv.extraMaterials=(inv.extraMaterials||[]).map(r=>({...r,total:n(r.quantity)*n(r.unitPrice)}));inv.manufacturing=inv.manufacturing||[];const wood=inv.woods.reduce((a,r)=>a+n(r.total),0),mat=inv.extraMaterials.reduce((a,r)=>a+n(r.total),0),man=inv.manufacturing.reduce((a,r)=>a+n(r.price),0),before=wood+mat+man;let discount=n(inv.discount?.value);if(inv.discount?.type==='percent')discount=before*discount/100;const final=Math.max(0,before-discount),paid=(inv.payments||[]).reduce((a,p)=>a+n(p.amount),0),remaining=Math.max(0,final-paid);const status=inv.status==='draft'?'draft':remaining<=0&&final>0?'paid':paid>0?'partial':'unpaid';return {...inv,totals:{wood,materials:mat,manufacturing:man,beforeDiscount:before,discount,finalTotal:final,paid,remaining},status}}
async function reserveInvoiceNumber(){const ref=doc(db,'users',user.uid,'counters','invoiceNumber');return runTransaction(db,async tx=>{const snap=await tx.get(ref);const next=(snap.exists()?n(snap.data().next):1);tx.set(ref,{next:next+1,updatedAt:serverTimestamp()},{merge:true});return String(next).padStart(6,'0')})}
async function ensureProfile(){const r=userRef();const s=await getDoc(r);if(!s.exists())await setDoc(r,{uid:user.uid,email:user.email||'',name:user.displayName||'',createdAt:serverTimestamp()},{merge:true})}
async function loadAll(){if(!user)return;setSync('جارٍ المزامنة','');try{let is,cs;try{[is,cs]=await Promise.all([getDocs(sub('invoices')),getDocs(sub('customers'))]);}catch(e){throw e}invoices=is.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt?.toDate?.()||b.date||'').localeCompare(String(a.createdAt?.toDate?.()||a.date||'')));customers=cs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));invoices=invoices.map(x=>calc(normalizeInvoice(x)));setSync(navigator.onLine?'تمت المزامنة':'محلي — بدون اتصال',navigator.onLine?'ok':'off')}catch(e){console.error(e);setSync('غير متصل','off');if(!invoices.length)toast('تعذر الاتصال الآن — حاول مرة أخرى عند توفر الإنترنت')}render()}
function normalizeInvoice(x){const o={...blankInvoice(),...x};o.customer={...blankInvoice().customer,...(x.customer||{})};o.woods=Array.isArray(x.woods)&&x.woods.length?x.woods:[blankWood()];o.extraMaterials=Array.isArray(x.extraMaterials)?x.extraMaterials:[];o.manufacturing=Array.isArray(x.manufacturing)?x.manufacturing:(x.manufacturing?[{product:'التصنيع',price:x.manufacturing}]:[]);o.payments=Array.isArray(x.payments)?x.payments:[];o.discount=x.discount&&typeof x.discount==='object'?x.discount:{type:'amount',value:n(x.discount)};o.date=x.date||new Date().toISOString().slice(0,10);return o}

function nav(){return `<div class="bottom"><div class="bottom-inner">${[['home','🏠','الرئيسية'],['invoices','🧾','الفواتير'],['quick','⚡','الحساب السريع'],['customers','👥','العملاء'],['more','☰','المزيد']].map(x=>`<button class="nav ${activeView===x[0]?'active':''}" data-nav="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></div>`}
function shell(content){return `<div class="top"><div class="brand"><div><div class="logo">Roof ART</div><div class="tag">فن تصنيع الأخشاب · خبرة • إتقان • تميّز</div></div><div id="sync" class="sync">...</div></div></div><main class="app">${content}</main>${nav()}`}
function home(){const active=invoices.filter(x=>!x.deleted),sales=active.filter(x=>x.date===new Date().toISOString().slice(0,10)).reduce((a,x)=>a+n(x.totals?.finalTotal),0),month=active.filter(x=>(x.date||'').slice(0,7)===new Date().toISOString().slice(0,7)).reduce((a,x)=>a+n(x.totals?.finalTotal),0),paid=active.reduce((a,x)=>a+n(x.totals?.paid),0),remain=active.reduce((a,x)=>a+n(x.totals?.remaining),0);return shell(`<section class="card"><div class="btns"><button class="btn primary" id="newBtn">➕ فاتورة جديدة</button><button class="btn gold" id="quickBtn">⚡ حساب سريع</button><button class="btn light" id="listBtn">🧾 الفواتير</button><button class="btn light" id="custBtn">👥 العملاء</button></div></section><section class="card"><div class="title">لوحة التحكم</div><div class="summary"><div class="stat"><small>مبيعات اليوم</small><b>${money(sales)}</b></div><div class="stat"><small>مبيعات الشهر</small><b>${money(month)}</b></div><div class="stat"><small>إجمالي المدفوع</small><b>${money(paid)}</b></div><div class="stat"><small>إجمالي المتبقي</small><b>${money(remain)}</b></div></div></section><section class="card"><div class="title">آخر الفواتير</div>${invoiceRows(active.slice(0,8))}</section>`)}
function invoiceRows(arr){if(!arr.length)return '<div class="empty">لا توجد فواتير بعد</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>رقم</th><th>العميل</th><th>التاريخ</th><th>الإجمالي</th><th>المتبقي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${arr.map(i=>`<tr><td>${esc(i.invoiceNumber||'-')}</td><td>${esc(i.customer?.name||'بدون اسم')}</td><td>${esc(i.date||'-')}</td><td>${money(i.totals?.finalTotal)}</td><td>${money(i.totals?.remaining)}</td><td>${badge(i.status)}</td><td><div class="row-actions"><button class="btn small light" data-open="${i.id}">فتح</button><button class="btn small light" data-copy="${i.id}">نسخ</button><button class="btn small danger" data-trash="${i.id}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`}
function badge(s){return `<span class="badge ${s||'draft'}">${s==='paid'?'مدفوعة بالكامل':s==='partial'?'مدفوعة جزئيًا':s==='unpaid'?'غير مدفوعة':'مسودة'}</span>`}
function invoiceEditor(inv,quick=false){inv=calc(JSON.parse(JSON.stringify(inv)));const isEdit=!!editingId;return shell(`<section class="card"><div class="title">${quick?'⚡ الحساب السريع':isEdit?'🧾 تعديل الفاتورة':'🧾 فاتورة جديدة'}</div><div class="grid"><div class="field"><label>رقم الفاتورة</label><input id="invoiceNumber" value="${esc(inv.invoiceNumber)}" readonly placeholder="يُنشأ عند الحفظ"></div><div class="field"><label>التاريخ</label><input id="invoiceDate" type="date" value="${esc(inv.date)}"></div><div class="field span2"><label>العميل</label><input id="customerName" list="customerList" value="${esc(inv.customer.name)}" placeholder="اسم العميل"><datalist id="customerList">${customers.map(c=>`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`).join('')}</datalist></div><div class="field"><label>رقم الهاتف</label><input id="customerPhone" value="${esc(inv.customer.phone)}"></div><div class="field"><label>العنوان</label><input id="customerAddress" value="${esc(inv.customer.address)}"></div><div class="field span2"><label>ملاحظات العميل</label><input id="customerNotes" value="${esc(inv.customer.notes)}"></div></div></section>${woodSection(inv)}${materialSection(inv)}${manufacturingSection(inv)}${summarySection(inv)}${paymentSection(inv)}<section class="card"><div class="title">📝 ملاحظات الفاتورة</div><div class="field"><textarea id="invoiceNotes" placeholder="مثال: التسليم خلال 15 يوم...">${esc(inv.invoiceNotes)}</textarea></div></section><section class="card"><div class="btns"><button class="btn primary" id="saveInvoice">💾 حفظ</button><button class="btn gold" id="shareInvoice">📤 مشاركة</button>${quick?'<button class="btn light" id="convertQuick">🧾 تحويل إلى فاتورة</button>':''}<button class="btn light" id="cancelEdit">رجوع</button></div></section>`)}
function woodSection(inv){return `<section class="card"><div class="title">① الأخشاب</div><div class="table-wrap"><table class="table" id="woodTable"><thead><tr><th>العدد</th><th>الطول سم</th><th>العرض سم</th><th>السمك سم</th><th>الكمية م³</th><th>سعر المتر</th><th>الإجمالي</th><th>ملاحظات</th><th>×</th></tr></thead><tbody>${inv.woods.map((r,i)=>woodRow(r,i)).join('')}</tbody></table></div><div class="btns" style="margin-top:8px"><button class="btn small light" id="addWood">➕ إضافة صف</button></div><div class="total-line"><span>إجمالي الأخشاب</span><b id="woodTotal">${money(inv.totals.wood)}</b></div></section>`}
function woodRow(r,i){return `<tr data-row="${i}"><td><input data-k="count" value="${esc(r.count)}"></td><td><input data-k="length" value="${esc(r.length)}"></td><td><input data-k="width" value="${esc(r.width)}"></td><td><input data-k="thickness" value="${esc(r.thickness)}"></td><td class="qty">${n(r.quantityM3).toFixed(3)}</td><td><input data-k="unitPrice" value="${esc(r.unitPrice)}"></td><td class="lineTotal">${money(r.total)}</td><td><input data-k="notes" value="${esc(r.notes)}"></td><td><button class="btn small danger" data-delwood="${i}">×</button></td></tr>`}
function materialSection(inv){return `<section class="card"><div class="title">② الخامات الإضافية</div><div class="table-wrap"><table class="table" id="matTable"><thead><tr><th>العدد</th><th>الصنف</th><th>سعر الوحدة</th><th>الإجمالي</th><th>×</th></tr></thead><tbody>${inv.extraMaterials.map((r,i)=>`<tr data-mrow="${i}"><td><input data-k="quantity" value="${esc(r.quantity)}"></td><td><input data-k="name" value="${esc(r.name)}"></td><td><input data-k="unitPrice" value="${esc(r.unitPrice)}"></td><td class="matTotal">${money(r.total)}</td><td><button class="btn small danger" data-delmat="${i}">×</button></td></tr>`).join('')}</tbody></table></div><div class="btns" style="margin-top:8px"><button class="btn small light" id="addMat">➕ إضافة خامة</button></div><div class="total-line"><span>إجمالي الخامات الإضافية</span><b id="matTotal">${money(inv.totals.materials)}</b></div></section>`}
function manufacturingSection(inv){return `<section class="card"><div class="title">③ التصنيع</div><div class="table-wrap"><table class="table"><thead><tr><th>المنتج</th><th>سعر التصنيع</th><th>×</th></tr></thead><tbody>${inv.manufacturing.map((r,i)=>`<tr data-mrow2="${i}"><td><input data-k="product" value="${esc(r.product)}"></td><td><input data-k="price" value="${esc(r.price)}"></td><td><button class="btn small danger" data-delman="${i}">×</button></td></tr>`).join('')}</tbody></table></div><div class="btns" style="margin-top:8px"><button class="btn small light" id="addMan">➕ إضافة منتج</button></div><div class="total-line"><span>إجمالي التصنيع</span><b id="manTotal">${money(inv.totals.manufacturing)}</b></div></section>`}
function summarySection(inv){return `<section class="card"><div class="title">💰 ملخص الحساب</div><div class="summary"><div class="stat"><small>الأخشاب</small><b id="sWood">${money(inv.totals.wood)}</b></div><div class="stat"><small>الخامات</small><b id="sMat">${money(inv.totals.materials)}</b></div><div class="stat"><small>التصنيع</small><b id="sMan">${money(inv.totals.manufacturing)}</b></div><div class="stat"><small>قبل الخصم</small><b id="sBefore">${money(inv.totals.beforeDiscount)}</b></div></div><div class="grid" style="margin-top:8px"><div class="field"><label>الخصم</label><input id="discountValue" type="number" value="${n(inv.discount.value)}"></div><div class="field"><label>نوع الخصم</label><select id="discountType"><option value="amount" ${inv.discount.type==='amount'?'selected':''}>مبلغ</option><option value="percent" ${inv.discount.type==='percent'?'selected':''}>نسبة %</option></select></div></div><div class="summary" style="margin-top:8px"><div class="stat"><small>قيمة الخصم</small><b id="sDiscount">${money(inv.totals.discount)}</b></div><div class="stat"><small>الإجمالي النهائي</small><b id="sFinal">${money(inv.totals.finalTotal)}</b></div><div class="stat"><small>إجمالي المدفوع</small><b id="sPaid">${money(inv.totals.paid)}</b></div><div class="stat"><small>المتبقي</small><b id="sRemaining">${money(inv.totals.remaining)}</b></div></div></section>`}
function paymentSection(inv){return `<section class="card"><div class="title">💳 الدفعات</div><div id="payments">${(inv.payments||[]).map((p,i)=>`<div class="grid" data-pay="${i}" style="margin-bottom:7px"><div class="field"><label>المبلغ</label><input data-k="amount" type="number" value="${n(p.amount)}"></div><div class="field"><label>التاريخ</label><input data-k="date" type="date" value="${esc(p.date||inv.date)}"></div><div class="field span2"><label>ملاحظة</label><input data-k="note" value="${esc(p.note||'')}"></div><button class="btn small danger" data-delpay="${i}">حذف الدفعة</button></div>`).join('')}</div><button class="btn small light" id="addPayment">➕ إضافة دفعة</button></section>`}
function collectEditor(){const inv=calc({invoiceNumber:$('invoiceNumber')?.value||'',date:$('invoiceDate').value,customer:{name:$('customerName').value.trim(),phone:$('customerPhone').value.trim(),address:$('customerAddress').value.trim(),notes:$('customerNotes').value.trim()},woods:Array.from(document.querySelectorAll('#woodTable tbody tr')).map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.value);return o}),extraMaterials:Array.from(document.querySelectorAll('#matTable tbody tr')).map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.value);return o}),manufacturing:Array.from(document.querySelectorAll('[data-mrow2]')).map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.value);return o}),discount:{type:$('discountType').value,value:n($('discountValue').value)},payments:Array.from(document.querySelectorAll('[data-pay]')).map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.value);return o}),invoiceNotes:$('invoiceNotes').value,status:activeView==='quick'?'draft':'unpaid'});return inv}
function bindEditor(){const update=()=>{const inv=collectEditor();refreshTotals(inv);localStorage.setItem(draftKey(),JSON.stringify(inv));if(activeView==='quick')localStorage.setItem('roofart-quick',JSON.stringify(inv))};document.querySelectorAll('#woodTable input,#matTable input,[data-mrow2] input,[data-pay] input,#discountValue,#discountType,#invoiceDate,#customerName,#customerPhone,#customerAddress,#customerNotes,#invoiceNotes').forEach(el=>el.addEventListener('input',update));$('addWood')?.addEventListener('click',()=>{const inv=collectEditor();inv.woods.push(blankWood());renderEditor(inv)});$('addMat')?.addEventListener('click',()=>{const inv=collectEditor();inv.extraMaterials.push(blankMaterial());renderEditor(inv)});$('addMan')?.addEventListener('click',()=>{const inv=collectEditor();inv.manufacturing.push(blankManufacturing());renderEditor(inv)});$('addPayment')?.addEventListener('click',()=>{const inv=collectEditor();inv.payments.push({amount:'',date:inv.date,note:''});renderEditor(inv)});document.querySelectorAll('[data-delwood]').forEach(b=>b.onclick=()=>{const inv=collectEditor();inv.woods.splice(+b.dataset.delwood,1);if(!inv.woods.length)inv.woods.push(blankWood());renderEditor(inv)});document.querySelectorAll('[data-delmat]').forEach(b=>b.onclick=()=>{const inv=collectEditor();inv.extraMaterials.splice(+b.dataset.delmat,1);if(!inv.extraMaterials.length)inv.extraMaterials.push(blankMaterial());renderEditor(inv)});document.querySelectorAll('[data-delman]').forEach(b=>b.onclick=()=>{const inv=collectEditor();inv.manufacturing.splice(+b.dataset.delman,1);if(!inv.manufacturing.length)inv.manufacturing.push(blankManufacturing());renderEditor(inv)});document.querySelectorAll('[data-delpay]').forEach(b=>b.onclick=()=>{const inv=collectEditor();inv.payments.splice(+b.dataset.delpay,1);renderEditor(inv)});$('saveInvoice').onclick=()=>saveInvoice();$('cancelEdit').onclick=()=>{editingId=null;activeView='home';render()};$('shareInvoice').onclick=()=>shareInvoice() function bindGlobal(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{activeView=b.dataset.nav;editingId=null;render()});$('newBtn')?.addEventListener('click',async()=>{editingId=null;const inv=blankInvoice();renderEditor(inv)});$('quickBtn')?.addEventListener('click',()=>{activeView='quick';render()});$('listBtn')?.addEventListener('click',()=>{activeView='invoices';render()});$('custBtn')?.addEventListener('click',()=>{activeView='customers';render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openInvoice(b.dataset.open));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyInvoice(b.dataset.copy));document.querySelectorAll('[data-trash]').forEach(b=>b.onclick=()=>trashInvoice(b.dataset.trash));$('search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('invoiceList').innerHTML=invoiceRows(invoices.filter(i=>!i.deleted&&(String(i.invoiceNumber).includes(q)||(i.customer?.name||'').toLowerCase().includes(q)||(i.customer?.phone||'').includes(q))))});$('custSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('custList').innerHTML=customerRows(customers.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)))});$('logoutBtn')?.addEventListener('click',()=>signOut(auth));$('backupBtn')?.addEventListener('click',backup);$('restoreBtn')?.addEventListener('click',restore);$('trashBtn')?.addEventListener('click',trashView);$('settingsBtn')?.addEventListener('click',settingsView);$('woodLibBtn')?.addEventListener('click',()=>libraryView('wood'));$('matLibBtn')?.addEventListener('click',()=>libraryView('mat'));$('manLibBtn')?.addEventListener('click',()=>libraryView('man'));document.querySelectorAll('[data-newcust]').forEach(b=>b.onclick=()=>{const c=customers.find(x=>x.name===b.dataset.newcust);const inv=blankInvoice();inv.customer=c||inv.customer;renderEditor(inv)})}

async function loadTrash(){const s=await getDocs(sub('trash'));const arr=s.docs.map(d=>({id:d.id,...d.data()}));$('trashContent').innerHTML=arr.length?arr.map(x=>`<div class="card"><b>${esc(x.invoiceNumber||'-')} — ${esc(x.customer?.name||'')}</b><div class="muted">${money(x.totals?.finalTotal)}</div><button class="btn small light" data-restore="${x.id}">استعادة</button><button class="btn small danger" data-perm="${x.id}">حذف نهائي</button></div>`).join(''):'<div class="empty">السلة فارغة</div>';document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreTrash(b.dataset.restore));document.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>deleteTrash(b.dataset.perm));$('emptyTrash')?.addEventListener('click',emptyTrash)}

function restore(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const batch=writeBatch(db);for(const x of data.customers||[])batch.set(doc(sub('customers'),x.id||normalizeId(x.name)),x,{merge:true});for(const x of data.invoices||[]){const id=x.id||crypto.randomUUID();delete x.id;batch.set(doc(sub('invoices'),id),x,{merge:true})}await batch.commit();await loadAll();toast('تمت الاستعادة')}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};input.click()}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function libraryView(type){const labels={wood:'مكتبة الأخشاب',mat:'مكتبة الخامات',man:'مكتبة التصنيع'};const field=type==='wood'?'name':'name';const coll=type==='wood'?'woodMaterials':type==='mat'?'extraMaterials':'manufacturingItems';const s=await getDocs(sub(coll));const arr=s.docs.map(d=>({id:d.id,...d.data()}));$('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="title">${labels[type]}</div><div id="libList">${arr.map(x=>`<div class="grid" style="margin:6px 0"><input class="field" data-lib-name="${esc(x.id)}" value="${esc(x.name||x.product||'')}"><input class="field" data-lib-price="${esc(x.id)}" type="number" value="${n(x.price??x.defaultPrice)}"><button class="btn small primary" data-lib-save="${esc(x.id)}">حفظ</button><button class="btn small danger" data-lib-del="${esc(x.id)}">×</button></div>`).join('')||'<div class="empty">المكتبة فارغة</div>'}</div><div class="divider"></div><div class="grid"><input id="newLibName" placeholder="اسم الصنف"><input id="newLibPrice" type="number" placeholder="السعر الافتراضي"><button class="btn primary" id="addLib">إضافة</button></div><div class="btns" style="margin-top:12px"><button class="btn light" onclick="document.getElementById('modalRoot').innerHTML=''">إغلاق</button></div></div></div>`;document.querySelectorAll('[data-lib-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.libSave;const name=document.querySelector(`[data-lib-name="${CSS.escape(id)}"]`).value.trim();const price=n(document.querySelector(`[data-lib-price="${CSS.escape(id)}"]`).value);await setDoc(doc(sub(coll),id),{name,price,updatedAt:serverTimestamp()},{merge:true});toast('تم الحفظ')});document.querySelectorAll('[data-lib-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الصنف من المكتبة؟')){await deleteDoc(doc(sub(coll),b.dataset.libDel));libraryView(type)}});$('addLib').onclick=async()=>{const name=$('newLibName').value.trim();if(!name)return;await addDoc(sub(coll),{name,price:n($('newLibPrice').value),create function settingsView(){const mode=localStorage.getItem('roof-mode')||'light';$('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="title">🎨 المظهر</div><div class="field"><label>الوضع</label><select id="mode"><option value="light">فاتح</option><option value="dark">داكن</option><option value="auto">تلقائي</option></select></div><div class="field" style="margin-top:8px"><label>حجم الخط</label><select id="fontSize"><option value="small">صغير</option><option value="medium">متوسط</option><option value="large">كبير</option></select></div><div class="btns" style="margin-top:12px"><button class="btn primary" id="saveSettings">حفظ</button><button class="btn light" onclick="document.getElementById('modalRoot').innerHTML=''">إغلاق</button></div></div></div>`;$('mode').value=mode;$('fontSize').value=localStorage.getItem('roof-font')||'medium';$('saveSettings').onclick=()=>{const m=$('mode').value,f=$('fontSize').value;localStorage.setItem('roof-mode',m);localStorage.setItem('roof-font',f);applySettings();$('modalRoot').innerHTML='';}}
function applySettings(){const m=localStorage.getItem('roof-mode')||'light';document.documentElement.dataset.theme=m;const dark=m==='dark'||(m==='auto'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches);if(dark){document.documentElement.style.setProperty('--bg','#11171c');document.documentElement.style.setProperty('--card','#1c252c');document.documentElement.style.setProperty('--text','#f2f5f7');document.documentElement.style.setProperty('--soft','#26323a');document.documentElement.style.setProperty('--line','#3a4750')}else{document.documentElement.style.removeProperty('--bg');document.documentElement.style.removeProperty('--card');document.documentElement.style.removeProperty('--text');document.documentElement.style.removeProperty('--soft');document.documentElement.style.removeProperty('--line')}const f=localStorage.getItem('roof-font')||'medium';document.body.style.fontSize=f==='small'?'13px':f==='large'?'17px':'15px'}
async function shareInvoice(){
 const inv=calc(collectEditor());
 const choice=prompt('اختر صيغة المشاركة:\n1 = صورة PNG\n2 = PDF','1');
 if(choice!=='1'&&choice!=='2')return;
 const html=buildExport(inv);
 const holder=$('export');holder.innerHTML=html.replace(/^<!doctype html><html[^>]*>|<\/html>|<head>[\\s\\S]*?<\/head>|<body[^>]*>|<\/body>/gi,'');holder.style.left='0';holder.style.top='0';holder.style.zIndex='-1';
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
 try{
   if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
   const canvas=await html2canvas(holder,{scale:2,backgroundColor:'#fff',useCORS:true,width:794});
   const base=safe((inv.customer.name||'فاتورة')+' - '+(inv.invoiceNumber||'مسودة'));
   if(choice==='1'){
      const blob=await new Promise(r=>canvas.toBlob(r,'image/png',1));
      await shareOrDownload(blob,base+'.png','image/png','Roof ART - صورة الفاتورة');
   }else{
      if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
      const img=canvas.toDataURL('image/jpeg',.94), pageW=210, pageH=297, margin=8, usableW=pageW-margin*2, imgH=canvas.height*usableW/canvas.width;
      let y=margin,remain=imgH,srcY=0;
      while(remain>0){const draw=Math.min(remain,pageH-margin-y);const crop=document.createElement('canvas');crop.width=canvas.width;crop.height=Math.max(1,Math.ceil(canvas.height*draw/imgH));crop.getContext('2d').drawImage(canvas,0,srcY,canvas.width,crop.height,0,0,crop.width,crop.height);pdf.addImage(crop.toDataURL('image/jpeg',.94),'JPEG',margin,y,usableW,draw,'FAST');remain-=draw;srcY+=crop.height;if(remain>0){pdf.addPage();y=margin}}
      const blob=pdf.output('blob');await shareOrDownload(blob,base+'.pdf','application/pdf','Roof ART - PDF الفاتورة');
   }
 }catch(e){console.error(e);alert('تعذر تجهيز الملف: '+e.message)}finally{holder.style.left='-100000px';holder.style.zIndex='-1'}
}
